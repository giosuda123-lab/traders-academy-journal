      });
    });

    renderMiniCalendar(dashEl.querySelector('#tj-dash-cal'), dayGroups);
  }
  function greeting(){
    const h = new Date().getHours();
    const time = h<12?'დილა მშვიდობისა':h<18?'შუადღე მშვიდობისა':'საღამო მშვიდობისა';
    return time+', თრეიდერო';
  }
  function renderMiniCalendar(el, dayGroups){
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth();
    const first = new Date(year, month, 1);
    const startOffset = (first.getDay()+6)%7; // Monday start
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const cells = [];
    for (let i=0;i<startOffset;i++) cells.push(null);
    for (let d=1; d<=daysInMonth; d++) cells.push(d);
    const wd = ['ორშ','სამ','ოთხ','ხუთ','პარ','შაბ','კვ'];
    el.innerHTML = `<div class="tj-cal-grid" style="margin-bottom:6px;">${wd.map(w=>`<div style="text-align:center; font-size:10px; color:var(--tj-text3);">${w}</div>`).join('')}</div>
      <div class="tj-cal-grid">${cells.map((d,i)=>{
        if (!d) return `<div></div>`;
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const g = dayGroups[dateStr];
        let bg = 'var(--tj-panel2)';
        if (g){ bg = g.r > 0 ? 'rgba(95,168,118,'+Math.min(0.85,0.35+Math.abs(g.r)/8)+')' : g.r < 0 ? 'rgba(193,93,76,'+Math.min(0.85,0.35+Math.abs(g.r)/8)+')' : 'var(--tj-border)'; }
        return `<div class="tj-cal-cell ${g?'has-data':''}" style="background:${bg}; --i:${i};" title="${dateStr}${g?` · ${g.n} ტრეიდი · ${fmtR(g.r)}`:''}">${d}</div>`;
      }).join('')}</div>`;
  }

  // ================= ANALYTICS =================
  function groupWinRate(items, keyFn, isArray){
    const groups = {};
    items.forEach(t=>{
      const keys = isArray ? (keyFn(t)||[]) : [keyFn(t)];
      keys.forEach(k=>{
        if (k===undefined||k===null||k==='') return;
        groups[k] = groups[k] || { win:0, total:0, sumR:0, sumUsd:0, usdN:0 };
        groups[k].total++; groups[k].sumR += num(t.resultR);
        if (hasUsd(t)){ groups[k].sumUsd += num(t.pnlUsd); groups[k].usdN++; }
        if (t.outcome==='win') groups[k].win++;
      });
    });
    return Object.entries(groups).map(([k,v])=>({ key:k, n:v.total, winRate: Math.round(100*v.win/v.total), avgR: v.sumR/v.total, sumUsd: v.sumUsd, usdN: v.usdN }));
  }
  function renderBreakdownTable(title, rows, minN, showUsd){
    minN = minN || 1;
    const filteredRows = rows.filter(r=>r.n>=minN).sort((a,b)=>b.avgR-a.avgR);
    if (!filteredRows.length) return '';
    return `<div style="margin-bottom:22px;">
      <div style="font-size:13px; font-weight:500; margin-bottom:10px;">${title}</div>
      <div class="tj-table-wrap"><table class="tj-table">
        <thead><tr><th>სახელი</th><th>N</th><th>Win rate</th><th>საშ. R</th>${showUsd?'<th>ჯამური $</th>':''}</tr></thead>
        <tbody>${filteredRows.map(r=>`<tr style="cursor:default;">
          <td>${escapeHtml(r.key)}</td><td class="tj-mono">${r.n}</td>
          <td class="tj-mono" style="color:${r.winRate<40?'var(--tj-red)':r.winRate<55?'var(--tj-amber)':'var(--tj-green)'};">${r.winRate}%</td>
          <td class="tj-mono" style="color:${r.avgR>=0?'var(--tj-green)':'var(--tj-red)'};">${fmtR(r.avgR)}</td>
          ${showUsd?`<td class="tj-mono" style="color:${r.sumUsd>=0?'var(--tj-green)':'var(--tj-red)'};">${r.usdN?fmtUsd(r.sumUsd):'-'}</td>`:''}
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  }
  function sleepBucketLabel(h){
    if (h===null) return null;
    if (h<5) return '< 5 სთ'; if (h<6) return '5-6 სთ'; if (h<7) return '6-7 სთ'; if (h<8) return '7-8 სთ'; if (h<9) return '8-9 სთ'; return '9+ სთ';
  }
  function renderSleepCorrelation(closedTrades){
    const qualifyingDays = dailyReports.filter(r => r.bedtime && r.wakeTime);
    const html = [];
    html.push(`<div style="font-size:11.5px; color:var(--tj-text3); background:var(--tj-panel2); border-radius:8px; padding:10px 12px; line-height:1.6; margin-bottom:14px;">ზოგადი რეკომენდაცია: 7-9 საათი ძილი და მუდმივი გრაფიკი აუმჯობესებს კონცენტრაციასა და დისციპლინას. ქვემოთ - თქვენი პირადი მონაცემებზე დაფუძნებული ანალიზი.</div>`);
    if (qualifyingDays.length < 10){
      html.push(`<div style="font-size:12.5px; color:var(--tj-text2); margin-bottom:20px;">მონაცემები არასაკმარისია პერსონალიზებული ანალიზისთვის - მინიმუმ 10 დღეა საჭირო. ამჟამად: ${qualifyingDays.length}/10.</div>`);
      return html.join('');
    }
    const byDate = {}; qualifyingDays.forEach(r => { byDate[r.date] = r; });
    const buckets = {};
    closedTrades.forEach(t=>{
      const rep = byDate[t.date]; if (!rep) return;
      const h = sleepHoursBetween(rep.bedtime, rep.wakeTime); const label = sleepBucketLabel(h); if (!label) return;
      buckets[label] = buckets[label] || { win:0, total:0, sumR:0 };
      buckets[label].total++; buckets[label].sumR += num(t.resultR); if (t.outcome==='win') buckets[label].win++;
    });
    const bucketRows = Object.entries(buckets).map(([k,v])=>({ key:k, n:v.total, winRate: Math.round(100*v.win/v.total), avgR: v.sumR/v.total }));
    if (bucketRows.length){
      const best = bucketRows.slice().sort((a,b)=>b.avgR-a.avgR)[0];
      html.push(`<div class="tj-panelcard" style="border-color:var(--tj-green); padding:14px 16px; margin-bottom:14px;"><div style="font-size:12px; color:var(--tj-green); font-weight:600; margin-bottom:6px;">თქვენი საუკეთესო ძილის ფანჯარა</div><div class="tj-serif" style="font-size:19px; font-weight:600;">${best.key}</div><div style="font-size:12px; color:var(--tj-text3); margin-top:4px;">${best.winRate}% Win rate · საშ. ${fmtR(best.avgR)} (n=${best.n})</div></div>`);
      html.push(renderBreakdownTable('შედეგები ძილის ხანგრძლივობის მიხედვით', bucketRows, 1));
    }
    const goalGroups = { met:{n:0,sumR:0}, partial:{n:0,sumR:0}, missed:{n:0,sumR:0} };
    closedTrades.forEach(t=>{ const rep = dailyReports.find(r=>r.date===t.date); if (!rep||!rep.goalResult) return; goalGroups[rep.goalResult].n++; goalGroups[rep.goalResult].sumR += num(t.resultR); });
    const goalRows = Object.entries(goalGroups).filter(([k,v])=>v.n>0).map(([k,v])=>({ key: k==='met'?'მიზანი მიღწეული':k==='partial'?'ნაწილობრივ':'ვერ მოხერხდა', n:v.n, avgR: v.sumR/v.n }));
    if (goalRows.length > 1){
      html.push(`<div style="margin-bottom:10px; font-size:13px; font-weight:500;">შედეგი Process Goal-ის მიხედვით</div>`);
      html.push(`<div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;">${goalRows.map(r=>statChip(r.key, fmtR(r.avgR)+' (n='+r.n+')', r.avgR>=0?'var(--tj-green)':'var(--tj-red)')).join('')}</div>`);
    }
    return html.join('');
  }
  function renderPsychology(closed){
    const withPsych = closed.filter(t=>t.confidence||t.discipline||t.execution);
    if (withPsych.length < 5) return `<div style="font-size:12.5px; color:var(--tj-text2); margin-bottom:20px;">ფსიქოლოგიური კორელაციისთვის საჭიროა მინიმუმ 5 ტრეიდი შევსებული Confidence/Discipline/Execution მაჩვენებლებით.</div>`;
    const avg = (key) => { const vals = withPsych.filter(t=>t[key]).map(t=>num(t[key])); return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null; };
    const avgConf = avg('confidence'), avgDisc = avg('discipline'), avgExec = avg('execution');
    const highConf = withPsych.filter(t=>num(t.confidence)>=8);
    const lowConf = withPsych.filter(t=>num(t.confidence)>0 && num(t.confidence)<6);
    function grpStats(arr){ if (!arr.length) return null; const wins=arr.filter(t=>t.outcome==='win').length; return { winRate: Math.round(100*wins/arr.length), avgR: arr.reduce((s,t)=>s+num(t.resultR),0)/arr.length, n: arr.length }; }
    const hc = grpStats(highConf), lc = grpStats(lowConf);
    return `
      <div style="display:flex; gap:24px; flex-wrap:wrap; margin-bottom:20px;">
        ${avgConf?`<div style="text-align:center;">${ring(avgConf*10,72)}<div style="font-size:11px; color:var(--tj-text3); margin-top:6px;">Confidence</div><div class="tj-mono" style="font-size:13px;">${avgConf.toFixed(1)}/10</div></div>`:''}
        ${avgDisc?`<div style="text-align:center;">${ring(avgDisc*10,72,'var(--tj-green)')}<div style="font-size:11px; color:var(--tj-text3); margin-top:6px;">Discipline</div><div class="tj-mono" style="font-size:13px;">${avgDisc.toFixed(1)}/10</div></div>`:''}
        ${avgExec?`<div style="text-align:center;">${ring(avgExec*10,72,'var(--tj-amber)')}<div style="font-size:11px; color:var(--tj-text3); margin-top:6px;">Execution</div><div class="tj-mono" style="font-size:13px;">${avgExec.toFixed(1)}/10</div></div>`:''}
      </div>
      ${(hc||lc) ? `<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:20px;">
        ${hc?`<div class="tj-panelcard" style="padding:14px 16px;"><div style="font-size:11.5px; color:var(--tj-text3); margin-bottom:8px;">Confidence ≥ 8</div><div class="tj-mono" style="font-size:18px; font-weight:600;">${hc.winRate}%</div><div style="font-size:11px; color:var(--tj-text3);">Win rate · ${fmtR(hc.avgR)} · n=${hc.n}</div></div>`:''}
        ${lc?`<div class="tj-panelcard" style="padding:14px 16px;"><div style="font-size:11.5px; color:var(--tj-text3); margin-bottom:8px;">Confidence < 6</div><div class="tj-mono" style="font-size:18px; font-weight:600;">${lc.winRate}%</div><div style="font-size:11px; color:var(--tj-text3);">Win rate · ${fmtR(lc.avgR)} · n=${lc.n}</div></div>`:''}
      </div>` : ''}
    `;
  }
  function renderMistakeAnalysis(closed){
    const groups = {};
    closed.forEach(t=>{ (t.vetoes||[]).forEach(v=>{ groups[v] = groups[v] || {n:0, usdImpact:0, usdN:0}; groups[v].n++; if (hasUsd(t)){ groups[v].usdImpact += num(t.pnlUsd); groups[v].usdN++; } }); });
    const rows = Object.entries(groups).map(([k,v])=>({key:k, n:v.n, usdImpact:v.usdImpact, usdN:v.usdN})).sort((a,b)=>b.n-a.n);
    if (!rows.length) return `<div style="font-size:12.5px; color:var(--tj-text2);">Veto/შეცდომების მონაცემი არ არის ჯერ. დაამატეთ ტიპური შეცდომები "პარამეტრები → Veto პირობები"-ში (მაგ. Overtrading, Revenge Trade, FOMO).</div>`;
    return `<div class="tj-table-wrap"><table class="tj-table"><thead><tr><th>შეცდომა</th><th>სიხშირე</th><th>P&L გავლენა</th></tr></thead><tbody>
      ${rows.map(r=>`<tr style="cursor:default;"><td>${escapeHtml(r.key)}</td><td class="tj-mono">${r.n}</td><td class="tj-mono" style="color:${r.usdN?(r.usdImpact<0?'var(--tj-red)':'var(--tj-green)'):'var(--tj-text3)'};">${r.usdN?fmtUsd(r.usdImpact):'-'}</td></tr>`).join('')}
    </tbody></table></div>`;
  }
  function renderSetupCards(closed){
    const rows = groupWinRate(closed, t=>t.setups, true).filter(r=>r.n>=1).sort((a,b)=>b.avgR-a.avgR);
    if (!rows.length) return '';
    return `<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:24px;">
      ${rows.map(r=>{
        const rTrades = closed.filter(t=>(t.setups||[]).includes(r.key));
        const sumPos = rTrades.filter(t=>num(t.resultR)>0).reduce((s,t)=>s+num(t.resultR),0);
        const sumNeg = rTrades.filter(t=>num(t.resultR)<0).reduce((s,t)=>s+num(t.resultR),0);
        const pf = sumNeg!==0 ? sumPos/Math.abs(sumNeg) : (sumPos>0?Infinity:0);
        return `<div class="tj-panelcard" style="padding:16px 18px;">
          <div style="font-size:13px; font-weight:600; margin-bottom:10px;">${escapeHtml(r.key)}</div>
          <div style="font-size:11.5px; color:var(--tj-text3); line-height:2;">
            Trades: <span class="tj-mono" style="color:var(--tj-text);">${r.n}</span><br/>
            Win Rate: <span class="tj-mono" style="color:${r.winRate>=55?'var(--tj-green)':'var(--tj-text)'};">${r.winRate}%</span><br/>
            Profit Factor: <span class="tj-mono" style="color:var(--tj-text);">${isFinite(pf)?pf.toFixed(2):'∞'}</span><br/>
            Average R: <span class="tj-mono" style="color:${r.avgR>=0?'var(--tj-green)':'var(--tj-red)'};">${fmtR(r.avgR)}</span>${r.usdN?`<br/>Net P&L: <span class="tj-mono" style="color:${r.sumUsd>=0?'var(--tj-green)':'var(--tj-red)'};">${fmtUsd(r.sumUsd)}</span>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }
  function renderAnalytics(){
    let filtered = getFilteredTrades();
    if (trades.length===0){ bodyEl.innerHTML = `<div style="padding:40px 0; text-align:center; color:var(--tj-text2); font-size:13px;">ანალიტიკისთვის საჭიროა მინიმუმ ერთი ჩანაწერი.</div>`; return; }
    const closed = filtered.filter(t=>t.outcome);
    bodyEl.innerHTML = renderFilterBar() + `<div id="tj-analytics-inner"></div>`;
    wireFilterBar(renderAnalytics);
    const inner = bodyEl.querySelector('#tj-analytics-inner');
    if (closed.length===0){ inner.innerHTML = `<div style="padding:40px 0; text-align:center; color:var(--tj-text2); font-size:13px;">ვერცერთი დახურული ტრეიდი ვერ მოიძებნა.</div>`; return; }

    const n = closed.length;
    const wins = closed.filter(t=>t.outcome==='win');
    const winRate = Math.round(100*wins.length/n);
    const totalR = closed.reduce((s,t)=>s+num(t.resultR),0);
    const avgR = totalR/n;
    const sumPosR = closed.filter(t=>num(t.resultR)>0).reduce((s,t)=>s+num(t.resultR),0);
    const sumNegR = closed.filter(t=>num(t.resultR)<0).reduce((s,t)=>s+num(t.resultR),0);
    const profitFactor = sumNegR!==0 ? sumPosR/Math.abs(sumNegR) : (sumPosR>0?Infinity:0);
    let outlierDropPct = null;
    if (wins.length>=1 && n>=2 && avgR>0){ const maxWinR = Math.max(...wins.map(t=>num(t.resultR))); const expWithoutMax = (totalR-maxWinR)/(n-1); const dropPct = (1-(expWithoutMax/avgR))*100; if (dropPct>50) outlierDropPct = Math.round(dropPct); }

    const sections = [
      ['overview','ზოგადი სურათი'], ['setup','Setup ანალიზი'], ['breakdown','გარჩევა'], ['mistakes','შეცდომების ანალიზი'], ['psychology','ფსიქოლოგია'], ['sleep','ძილი და შედეგები']
    ];
    inner.innerHTML = `
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;">${sections.map(([k,l])=>`<button type="button" data-sec="${k}" class="tj-btn ${k==='overview'?'active':''}">${l}</button>`).join('')}</div>
      <div id="tj-analytics-sections">
        <div data-section="overview">
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;"><div style="font-size:13px; font-weight:500;">ძირითადი მაჩვენებლები</div>${sampleBadge(n)}</div>
          <div class="tj-kpi-grid" style="margin-bottom:20px;">
            ${metricCard('სულ ტრეიდი', n)}
            ${metricCard('Win rate', winRate+'%', '', 'var(--tj-green)')}
            ${metricCard('Profit factor', isFinite(profitFactor)?profitFactor.toFixed(2):'∞')}
            ${metricCard('Expectancy', fmtR(avgR), '', avgR>=0?'var(--tj-green)':'var(--tj-red)')}
            ${metricCard('ჯამური R', fmtR(totalR), '', totalR>=0?'var(--tj-green)':'var(--tj-red)')}
          </div>
          ${outlierDropPct?`<div class="tj-panelcard" style="border-color:var(--tj-amber); padding:12px 16px; margin-bottom:20px; font-size:12.5px; color:var(--tj-text2);">⚠ Expectancy მნიშვნელოვნად არის დამოკიდებული ერთ საუკეთესო ტრეიდზე - მისი გამორიცხვისას Expectancy იკლებს ${outlierDropPct}%-ით.</div>`:''}
        </div>
        <div data-section="setup" style="display:none;">${renderSetupCards(closed)}</div>
        <div data-section="breakdown" style="display:none;">
          ${renderBreakdownTable('Setup-ების მიხედვით', groupWinRate(closed,t=>t.setups,true), 3, true)}
          ${renderBreakdownTable('ინსტრუმენტების მიხედვით', groupWinRate(closed,t=>t.instrument,false), 3, true)}
          ${renderBreakdownTable('მიმართულების მიხედვით', groupWinRate(closed,t=>t.direction==='long'?'Long':'Short',false), 1, true)}
          ${renderBreakdownTable('სესიის მიხედვით', groupWinRate(closed,t=>sessionLabel(t.session),false), 1, true)}
          ${renderBreakdownTable('კვირის დღის მიხედვით', groupWinRate(closed,t=>weekdayName(t.date),false), 3, true)}
          ${renderBreakdownTable('თრეიდის ტიპის მიხედვით', groupWinRate(closed,t=>tradeContextLabel(t)||null,false), 1, true)}
          ${renderBreakdownTable('გეგმის დაცვის მიხედვით', groupWinRate(closed,t=>t.planAdherence==='no'?'გეგმა დარღვეული':'გეგმა დაცული',false), 1, true)}
        </div>
        <div data-section="mistakes" style="display:none;">${renderMistakeAnalysis(closed)}</div>
        <div data-section="psychology" style="display:none;">${renderPsychology(closed)}</div>
        <div data-section="sleep" style="display:none;">${renderSleepCorrelation(closed)}</div>
      </div>
    `;
    inner.querySelectorAll('[data-sec]').forEach(btn=>{
      btn.onclick = () => {
        if (btn.classList.contains('active')) return;
        inner.querySelectorAll('[data-sec]').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const target = inner.querySelector(`[data-section="${btn.dataset.sec}"]`);
        const current = inner.querySelector('[data-section]:not([style*="display: none"])');
        if (current && current!==target) current.style.display = 'none';
        target.style.display = 'block';
        target.classList.remove('tj-fadein'); void target.offsetWidth; target.classList.add('tj-fadein');
      };
    });
  }

  let aiLoading=false, aiError='', aiResult='';
  function renderAI(){
    const closed = trades.filter(t=>t.outcome);
    bodyEl.innerHTML = `
      <div class="tj-serif" style="font-size:17px; font-weight:600; margin-bottom:6px;">AI ანალიზი</div>
      <div style="font-size:12.5px; color:var(--tj-text2); margin-bottom:20px; line-height:1.6;">AI აანალიზებს თქვენს საკუთარ ტრეიდებს, Setup/Veto ტეგებს, ფასებს/P&L-ს და დღის რეპორტებს - მეთოდოლოგიის ცოდნის გარეშე, მხოლოდ თქვენს მონაცემებზე დაყრდნობით.</div>
      <button id="tj-ai-run" type="button" class="tj-btn primary" style="padding:10px 22px;" ${closed.length<10?'disabled':''}>${aiLoading?'<span class="tj-spin"></span>მუშავდება…':'ანალიზის გაშვება'}</button>
      ${closed.length<10?`<div style="margin-top:10px; font-size:12px; color:var(--tj-text3);">საჭიროა მინიმუმ 10 დახურული ტრეიდი (ამჟამად: ${closed.length}).</div>`:''}
      <div id="tj-ai-out" style="margin-top:20px;"></div>
    `;
    const out = bodyEl.querySelector('#tj-ai-out');
    if (aiError) out.innerHTML = `<div style="color:var(--tj-red); font-size:13px;">${escapeHtml(aiError)}</div>`;
    if (aiResult) out.innerHTML = `<div class="tj-ai-card tj-rise"><div class="tj-ai-card-header"><div class="tj-ai-icon">✦</div><div><div class="tj-ai-title">პერსონალური ანალიზი</div><div class="tj-ai-sub">დაფუძნებულია თქვენს ჟურნალზე</div></div></div><div class="tj-ai-content">${window.marked?marked.parse(aiResult):escapeHtml(aiResult)}</div></div>`;
    const btn = bodyEl.querySelector('#tj-ai-run');
    if (btn) btn.onclick = async () => {
      aiLoading = true; aiError=''; renderAI();
      try {
        const setupStats = groupWinRate(closed, t=>t.setups, true);
        const vetoStats = groupWinRate(closed, t=>t.vetoes, true);
        const sleepDays = dailyReports.filter(r=>r.bedtime&&r.wakeTime).map(r=>({ date:r.date, sleepHours: sleepHoursBetween(r.bedtime,r.wakeTime), goalResult:r.goalResult, energy:r.energy, stress:r.stress }));
        const payload = {
          summary: { n: closed.length, winRate: Math.round(100*closed.filter(t=>t.outcome==='win').length/closed.length), avgR: closed.reduce((s,t)=>s+num(t.resultR),0)/closed.length },
          setupStats, vetoStats,
          trades: closed.slice(-150).map(t=>({ date:t.date, instrument:t.instrument, direction:t.direction, setups:t.setups, vetoes:t.vetoes, resultR:num(t.resultR), pnlUsd: hasUsd(t)?num(t.pnlUsd):null, riskPct:num(t.riskPct), planAdherence:t.planAdherence, marketTags:t.marketTags, confidence:t.confidence, discipline:t.discipline, execution:t.execution })),
          dailyReports: sleepDays
        };
        const { data, error } = await supabase.functions.invoke('analyze-trades', { body: payload });
        if (error) throw error;
        aiResult = (data && data.comment) || 'პასუხი ვერ მოვიდა.';
      } catch(e){ aiError = 'ანალიზის გაშვება ვერ მოხერხდა: ' + (e && e.message ? e.message : 'უცნობი შეცდომა'); }
      aiLoading = false; renderAI();
    };
  }

  function renderGuide(){
    bodyEl.innerHTML = `<div class="tj-serif" style="font-size:17px; font-weight:600; margin-bottom:14px;">ინსტრუქცია</div>
      <div class="tj-ai-content" style="font-size:13.5px;">
        <h2>უნივერსალური ჟურნალი</h2>

        <p>ავსეთ ყოველდღე, ტრეიდის არსებობის მიუხედავად. მთავარი აქცენტი არის ერთი, კონკრეტული პროცესის მიზანი დღეში და მისი პატიოსანი თვითშეფასება.</p>
        <h2>ძილის კონტროლი</h2>
        <p>მინიმუმ 10 დღის მონაცემის დაგროვების შემდეგ, ანალიტიკის გვერდზე ავტომატურად გამოჩნდება, ძილის რომელ ხანგრძლივობაზე გაქვთ საუკეთესო შედეგები.</p>
        <h2>შეცდომების ანალიზი</h2>
        <p>"Veto პირობებში" შეგიძლიათ ჩაწეროთ ტიპური შეცდომები (Overtrading, Revenge Trade, FOMO და ა.შ.) - ანალიტიკის "შეცდომების ანალიზი" სექცია აჩვენებს მათ სიხშირესა და გავლენას შედეგზე.</p>
        <h2>AI ანალიზი</h2>
        <p>AI აანალიზებს მხოლოდ თქვენს საკუთარ მონაცემებს - მას არ აქვს ჩაშენებული არცერთი კონკრეტული სავაჭრო მეთოდოლოგია.</p>
      </div>`;
  }

  // ================= ROUTER =================
  function renderPage(){
    if (page==='dashboard') renderDashboard();
    else if (page==='new') renderNewTrade();
    else if (page==='trades') renderTrades();
    else if (page==='drc') renderDRC();
    else if (page==='analytics') renderAnalytics();
    else if (page==='ai') renderAI();
    else if (page==='accounts') renderAccounts();
    else if (page==='settings') renderSettings();
    else renderGuide();
    bodyEl.classList.remove('tj-fadein'); void bodyEl.offsetWidth; bodyEl.classList.add('tj-fadein');
  }

  // ================= DATA (Supabase) =================
  const statusEl = document.getElementById('tj-status');
  const toastsEl = document.getElementById('tj-toasts');
  function showToast(text, kind, duration){
    kind = kind || 'info';
    if (duration === undefined) duration = kind==='error' ? 5200 : 3000;
    const el = document.createElement('div');
    el.className = 'tj-toast ' + kind;
    const icon = kind==='ok' ? '<span class="tj-check-pop">✓</span>' : kind==='error' ? '!' : 'i';
    el.innerHTML = `<span class="tj-toast-icon">${icon}</span><span>${escapeHtml(text)}</span>`;
    toastsEl.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
    if (duration){
      setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 380); }, duration);
    }
    return el;
  }
  function showStatus(text, kind){ showToast(text, kind); }
  function setBtnLoading(btn, loading, loadingText){
    if (!btn) return;
    if (loading){
      if (btn.dataset.origLabel===undefined) btn.dataset.origLabel = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = `<span class="tj-spin"></span>${escapeHtml(loadingText||'ინახება…')}`;
    } else {
      btn.disabled = false;
      if (btn.dataset.origLabel!==undefined){ btn.textContent = btn.dataset.origLabel; delete btn.dataset.origLabel; }
    }
  }

  async function loadTrades(){
    if (!currentUser){ trades=[]; return; }
    try {
      const { data, error } = await supabase.from('trades').select('id, data').eq('user_id', currentUser.id).order('created_at', { ascending:true });
      if (error) throw error;
      trades = (data||[]).map(row => ({ ...row.data, id: row.id }));
    } catch(e){ trades=[]; showStatus('ტრეიდების ჩატვირთვა ვერ მოხერხდა: '+(e&&e.message?e.message:'უცნობი შეცდომა'), 'error'); }
  }
  async function addTradeRemote(tradeObj){
    if (!currentUser){ showStatus('გთხოვთ, ჯერ შეხვიდეთ ანგარიშში.', 'error'); return false; }
    try {
      const { data, error } = await supabase.from('trades').insert({ user_id: currentUser.id, data: tradeObj }).select('id, data').single();
      if (error) throw error;
      trades.push({ ...data.data, id: data.id });
      statusEl.style.display='none';
      return true;
    } catch(e){ showStatus('შენახვის შეცდომა: '+(e&&e.message?e.message:'უცნობი'), 'error'); return false; }
  }
  async function updateTradeRemote(id, tradeObj){
    if (!currentUser) return false;
    try {
      const { error } = await supabase.from('trades').update({ data: tradeObj }).eq('id', id).eq('user_id', currentUser.id);
      if (error) throw error;
      const idx = trades.findIndex(t=>t.id===id);
      if (idx!==-1) trades[idx] = { ...tradeObj, id };
      statusEl.style.display='none';
      return true;
    } catch(e){ showStatus('განახლების შეცდომა: '+(e&&e.message?e.message:'უცნობი'), 'error'); return false; }
  }
  async function deleteTradeRemote(id){
    if (!currentUser) return false;
    try {
      const { error } = await supabase.from('trades').delete().eq('id', id).eq('user_id', currentUser.id);
      if (error) throw error;
      trades = trades.filter(t=>t.id!==id);
      return true;
    } catch(e){ showStatus('წაშლის შეცდომა: '+(e&&e.message?e.message:'უცნობი'), 'error'); return false; }
  }
  async function loadDailyReports(){
    if (!currentUser){ dailyReports=[]; return; }
    try {
      const { data, error } = await supabase.from('daily_reports').select('id, date, data').eq('user_id', currentUser.id).order('date', { ascending:true });
      if (error) throw error;
      dailyReports = (data||[]).map(row => ({ ...row.data, date: row.date, id: row.id }));
    } catch(e){ dailyReports=[]; }
  }
  async function saveDailyReport(reportObj){
    if (!currentUser) return false;
    try {
      const { error } = await supabase.from('daily_reports').upsert({ user_id: currentUser.id, date: reportObj.date, data: reportObj }, { onConflict:'user_id,date' });
      if (error) throw error;
      dailyReports = dailyReports.filter(r=>r.date!==reportObj.date);
      dailyReports.push(reportObj);
      return true;
    } catch(e){ showStatus('დღის რეპორტის შენახვის შეცდომა: '+(e&&e.message?e.message:'უცნობი'), 'error'); return false; }
  }
  async function loadSettings(){
    if (!currentUser) return;
    try {
      const { data, error } = await supabase.from('journal_settings').select('data').eq('user_id', currentUser.id).maybeSingle();
      if (error) throw error;
      if (data && data.data) settings = Object.assign({ setups:[], vetoes:[], marketTags:[], srTags:[], instruments:[], pointValues:{} }, data.data);
    } catch(e){}
  }
  async function saveSettings(){
    if (!currentUser) return false;
    try { const { error } = await supabase.from('journal_settings').upsert({ user_id: currentUser.id, data: settings }, { onConflict:'user_id' }); if (error) throw error; return true; }
    catch(e){ return false; }
  }
  async function startApp(){
    await Promise.all([loadTrades(), loadDailyReports(), loadSettings()]);
    renderNav();
    renderPage();
  }
  (async function bootstrap(){
    renderAuthTabs();
    renderAuthBody();
    try { const { data:{ session } } = await supabase.auth.getSession(); if (session && session.user) await onAuthSuccess(session.user); }
    catch(e){ showStatus('Supabase-თან დაკავშირება ვერ მოხერხდა.', 'error'); }
  })();
})();
