<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0F1114; min-height: 100vh; }
  body { display:flex; flex-direction:column; align-items:center; padding: 24px 16px; }
  .tj { font-family: 'Inter', -apple-system, sans-serif; color: var(--tj-text); background: transparent; max-width: 1100px; width: 100%; }
  .tj :where(input, select, textarea, button) { font-family: inherit; }
  .tj-mono { font-family: 'IBM Plex Mono', monospace; }
  .tj-serif { font-family: 'Source Serif 4', Georgia, serif; }
  .tj :where(input, select, textarea) { min-height: 38px; font-size: 16px; }
  .tj button { min-height: 38px; }
  #tj-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #tj-tabs::-webkit-scrollbar { display: none; }
  #tj-tabs button { flex-shrink: 0; white-space: nowrap; }
  @media (max-width: 640px) {
    body { padding: 0; }
    .tj { border-radius: 0; border-left: none; border-right: none; }
    .tj-serif { font-size: 17px !important; }
    #tj-header-row { flex-direction: column; align-items: stretch !important; gap: 12px !important; padding: 16px 14px 12px !important; }
    #tj-header-right { flex-direction: column; align-items: stretch !important; gap: 10px !important; width: 100%; }
    #tj-tabs { width: 100%; -webkit-mask-image: linear-gradient(90deg, transparent, black 14px, black calc(100% - 14px), transparent); mask-image: linear-gradient(90deg, transparent, black 14px, black calc(100% - 14px), transparent); }
    #tj-tabs button { font-size: 12px !important; padding: 7px 11px !important; }
    #tj-user-box { justify-content: space-between !important; width: 100%; }
    #tj-body { padding: 14px 12px 18px !important; }
    .tj-ai-card { padding: 18px 16px !important; }
    .tj-ai-content table { font-size: 11px !important; }
    .tj-ai-content th, .tj-ai-content td { padding: 6px 7px !important; }
    div[style*="grid-template-columns:repeat(2"] { grid-template-columns: 1fr !important; }
  }
  .tj-ai-card { background: var(--tj-panel); border: 0.5px solid var(--tj-border); border-radius: 14px; padding: 28px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
  .tj-ai-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 0.5px solid var(--tj-border); }
  .tj-ai-card-header .tj-ai-icon { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--tj-accent), #F4D98A); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; }
  .tj-ai-card-header .tj-ai-title { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; color: var(--tj-text); font-weight: 600; }
  .tj-ai-card-header .tj-ai-sub { font-size: 11px; color: var(--tj-text3); margin-top: 1px; }
  .tj-ai-content { font-size: 13.5px; line-height: 1.8; color: var(--tj-text2); }
  .tj-ai-content h1, .tj-ai-content h2, .tj-ai-content h3 { color: var(--tj-text); font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; }
  .tj-ai-content h1 { font-size: 18px; margin: 28px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--tj-border); }
  .tj-ai-content h1:first-child { margin-top: 0; }
  .tj-ai-content h2 { font-size: 15px; margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; }
  .tj-ai-content h2:first-child { margin-top: 0; }
  .tj-ai-content h2::before { content: ''; width: 4px; height: 15px; border-radius: 3px; background: var(--tj-accent); display: inline-block; }
  .tj-ai-content h3 { font-size: 13.5px; margin: 18px 0 8px; color: var(--tj-accent); }
  .tj-ai-content p { margin: 0 0 14px; }
  .tj-ai-content strong { color: var(--tj-text); font-weight: 700; }
  .tj-ai-content ul, .tj-ai-content ol { margin: 0 0 14px; padding-left: 22px; }
  .tj-ai-content li { margin-bottom: 6px; }
  .tj-ai-content li::marker { color: var(--tj-accent); }
  .tj-ai-content hr { border: none; border-top: 1px dashed var(--tj-border); margin: 24px 0; }
  .tj-ai-content table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 14px 0 18px; font-size: 12.5px; border: 0.5px solid var(--tj-border); border-radius: 10px; overflow: hidden; }
  .tj-ai-content th { text-align: left; padding: 9px 12px; background: var(--tj-panel2); color: var(--tj-text); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .tj-ai-content td { padding: 9px 12px; border-top: 0.5px solid var(--tj-border); }
  .tj-ai-content tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
  .tj-ai-content code { font-family: 'IBM Plex Mono', monospace; background: var(--tj-panel2); padding: 1px 6px; border-radius: 5px; font-size: 12px; color: var(--tj-accent); }
  .tj-ai-content > *:last-child { margin-bottom: 0; }
  .tj-chip { padding: 7px 13px; border-radius: 999px; font-size: 12.5px; cursor: pointer; border: 0.5px solid var(--tj-border); background: transparent; color: var(--tj-text2); transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease; display:inline-flex; align-items:center; gap:6px; }
  .tj-chip:hover { border-color: var(--tj-accent); color: var(--tj-text); }
  .tj-chip.sel { border-color: var(--tj-accent); background: rgba(230,185,77,0.16); color: var(--tj-text); }
  .tj-chip.veto.sel { border-color: var(--tj-red); background: rgba(193,93,76,0.14); color: var(--tj-text); }
  .tj-chip-del { opacity:0.5; font-size:11px; }
  .tj-chip-del:hover { opacity:1; color: var(--tj-red); }
  .tj-rate { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:8px; border:0.5px solid var(--tj-border); background:transparent; color:var(--tj-text2); font-size:12.5px; cursor:pointer; font-family:'IBM Plex Mono',monospace; }
  .tj-rate.sel { border-color: var(--tj-accent); background: rgba(230,185,77,0.18); color: var(--tj-text); }
  .tj-drc-strip-day { width:16px; height:16px; border-radius:4px; flex-shrink:0; transition: transform 0.18s ease; }
  .tj-drc-strip-day:hover { transform: scale(1.25); }

  /* ===== premium motion layer (restrained) ===== */
  @keyframes tjFadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  #tj-body.tj-fadein { animation: tjFadeUp 0.35s cubic-bezier(0.22,1,0.36,1) both; }
  #tj-header-row .tj-serif { position:relative; padding-bottom:4px; }
  #tj-header-row .tj-serif::after { content:''; position:absolute; left:0; bottom:-2px; width:34px; height:2px; border-radius:2px; background:var(--tj-accent); }
  #tj-tabs button { transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease; }
  .tj button, .tj input, .tj select, .tj textarea { transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease; }
  .tj-ai-card { transition: box-shadow 0.2s ease; }
  .tj-ai-card:hover { box-shadow: 0 10px 28px rgba(0,0,0,0.3); }
  .tj-panelcard { transition: box-shadow 0.2s ease, border-color 0.2s ease; }
  .tj-panelcard:hover { box-shadow: 0 6px 16px rgba(0,0,0,0.22); border-color: rgba(230,185,77,0.45); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--tj-accent) !important; box-shadow: 0 0 0 2px rgba(230,185,77,0.14); }
  ::selection { background: rgba(230,185,77,0.28); }
</style>
</head>

<div class="tj" style="

<script>
(function(){
  // ===================== STATE =====================
  let currentUser = null;
  let authTab = 'login';
  let tab = 'new';
  let trades = [];
  let dailyReports = [];
  let editingTradeId = null;
  let drcDate = todayStr();

  let settings = { setups: [], vetoes: [], marketTags: [], srTags: [], instruments: [] };

  let accounts = (function(){
    try { return JSON.parse(window.localStorage.getItem('tj_accounts_v3')) || []; }
    catch(e){ return []; }
  })();
  function persistAccounts(){
    try { window.localStorage.setItem('tj_accounts_v3', JSON.stringify(accounts)); } catch(e){}
  }

  let filters = { instrument:[], direction:[], outcome:[], setup:[], veto:[], accountId:[], adherence:[], dateFrom:'', dateTo:'' };

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtDate(d){
    if (!d) return '';
    const dt = new Date(d + 'T00:00:00');
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString('ka-GE', { day:'2-digit', month:'2-digit', year:'numeric' });
  }
  function weekdayName(dateStr){
    if (!dateStr) return '';
    const days = ['კვირა','ორშ','სამ','ოთხ','ხუთ','პარ','შაბ'];
    const dt = new Date(dateStr + 'T00:00:00');
    if (isNaN(dt)) return '';
    return days[dt.getDay()];
  }
  function fmtR(v){
    if (v===null || v===undefined || isNaN(v)) return '-';
    return (v>0?'+':'') + v.toFixed(2) + 'R';
  }
  function sleepHoursBetween(bed, wake){
    if (!bed || !wake) return null;
    const [bh,bm] = bed.split(':').map(Number);
    const [wh,wm] = wake.split(':').map(Number);
    if (isNaN(bh)||isNaN(wh)) return null;
    let bedMin = bh*60+bm, wakeMin = wh*60+wm;
    let diff = wakeMin - bedMin;
    if (diff <= 0) diff += 24*60;
    return +(diff/60).toFixed(2);
  }

  const root = document.currentScript.previousElementSibling;
  const tabsEl = root.querySelector('#tj-tabs');
  const bodyEl = root.querySelector('#tj-body');
  const lightbox = root.querySelector('#tj-lightbox');
  const lightboxContent = root.querySelector('#tj-lightbox-content');
  const lightboxClose = root.querySelector('#tj-lightbox-close');

  function openImageModal(dataUrl){
    lightboxContent.innerHTML = `<img src="${dataUrl}" style="max-width:100%; max-height:78vh; border-radius:8px; display:block;"/>`;
    lightbox.style.display = 'flex';
  }
  function closeChartModal(){ lightbox.style.display = 'none'; lightboxContent.innerHTML = ''; }
  lightboxClose.addEventListener('click', closeChartModal);
  lightbox.addEventListener('click', (e)=>{ if (e.target === lightbox) closeChartModal(); });
  window.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeChartModal(); });

  function fileToCompressedBase64(file, maxW){
    maxW = maxW || 1280;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ===================== AUTH =====================
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const authWrap = root.querySelector('#tj-auth');
  const authTabsEl = root.querySelector('#tj-auth-tabs');
  const authBodyEl = root.querySelector('#tj-auth-body');
  const appWrap = root.querySelector('#tj-app');
  const userBox = root.querySelector('#tj-user-box');
  const userEmailEl = root.querySelector('#tj-user-email');
  const logoutBtn = root.querySelector('#tj-logout-btn');

  function authBtnStyle(active){
    return `padding:6px 16px; border-radius:8px; font-size:13px; cursor:pointer; border:0.5px solid ${active? 'var(--tj-accent)':'var(--tj-border)'}; background:${active? 'rgba(230,185,77,0.15)':'transparent'}; color:${active? 'var(--tj-text)':'var(--tj-text2)'};`;
  }
  function authMsgBox(){ return `<div id="tj-auth-msg" style="font-size:12px; margin-top:10px; min-height:16px; text-align:center;"></div>`; }
  function renderAuthTabs(){
    authTabsEl.innerHTML = `
      <button data-t="login" style="${authBtnStyle(authTab==='login')}">შესვლა</button>
      <button data-t="register" style="${authBtnStyle(authTab==='register')}">რეგისტრაცია</button>
    `;
    authTabsEl.querySelectorAll('button').forEach(b=>{ b.onclick = () => { authTab = b.dataset.t; renderAuthTabs(); renderAuthBody(); }; });
  }
  function renderAuthBody(){ if (authTab === 'login') renderLoginForm(); else renderRegisterForm(); }
  function describeError(err){
    if (!err) return 'უცნობი შეცდომა';
    if (typeof err === 'string') return err;
    if (err.message) return err.message;
    try { const s = JSON.stringify(err); return (s && s !== '{}') ? s : 'უცნობი შეცდომა.'; } catch(e){ return 'უცნობი შეცდომა.'; }
  }
  function renderLoginForm(){
    authBodyEl.innerHTML = `
      <form id="tj-login-form">
        <div style="margin-bottom:12px;">${fieldLabel('ელფოსტა')}<input type="email" name="email" required style="${inputStyle()}"/></div>
        <div style="margin-bottom:6px;">${fieldLabel('პაროლი')}<input type="password" name="password" required style="${inputStyle()}"/></div>
        <button type="submit" style="width:100%; margin-top:14px; padding:10px; border-radius:8px; border:0.5px solid var(--tj-accent); background:rgba(230,185,77,0.18); color:var(--tj-text); font-size:13px; cursor:pointer;">შესვლა</button>
        ${authMsgBox()}
      </form>`;
    const form = authBodyEl.querySelector('#tj-login-form');
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      const msg = form.querySelector('#tj-auth-msg');
      msg.style.color = 'var(--tj-text2)'; msg.textContent = 'შესვლა მიმდინარეობს…';
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') });
        if (error){ msg.style.color = 'var(--tj-red)'; msg.textContent = error.message === 'Invalid login credentials' ? 'ელფოსტა ან პაროლი არასწორია.' : describeError(error); return; }
        await onAuthSuccess(data.user);
      } catch(ex){ msg.style.color = 'var(--tj-red)'; msg.textContent = 'კავშირის შეცდომა.'; }
    });
  }
  function renderRegisterForm(){
    authBodyEl.innerHTML = `
      <form id="tj-register-form">
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; margin-bottom:12px;">
          <div>${fieldLabel('სახელი')}<input type="text" name="firstName" required style="${inputStyle()}"/></div>
          <div>${fieldLabel('გვარი')}<input type="text" name="lastName" required style="${inputStyle()}"/></div>
        </div>
        <div style="margin-bottom:12px;">${fieldLabel('ელფოსტა')}<input type="email" name="email" required style="${inputStyle()}"/></div>
        <div style="margin-bottom:6px;">${fieldLabel('პაროლი (მინ. 6 სიმბოლო)')}<input type="password" name="password" minlength="6" required style="${inputStyle()}"/></div>
        <button type="submit" style="width:100%; margin-top:14px; padding:10px; border-radius:8px; border:0.5px solid var(--tj-accent); background:rgba(230,185,77,0.18); color:var(--tj-text); font-size:13px; cursor:pointer;">რეგისტრაცია</button>
        ${authMsgBox()}
      </form>`;
    const form = authBodyEl.querySelector('#tj-register-form');
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      const msg = form.querySelector('#tj-auth-msg');
      msg.style.color = 'var(--tj-text2)'; msg.textContent = 'იგზავნება…';
      const email = fd.get('email');
      try {
        const { data, error } = await supabase.auth.signUp({ email, password: fd.get('password'), options: { data: { first_name: fd.get('firstName'), last_name: fd.get('lastName') } } });
        if (error){ msg.style.color = 'var(--tj-red)'; msg.textContent = describeError(error); return; }
        renderVerifyForm(email);
      } catch(ex){ msg.style.color = 'var(--tj-red)'; msg.textContent = 'კავშირის შეცდომა.'; }
    });
  }
  function renderVerifyForm(email){
    authBodyEl.innerHTML = `
      <div style="text-align:center; font-size:13px; color:var(--tj-text2); margin-bottom:16px;">კოდი გამოგზავნილია მისამართზე<br/><span style="color:var(--tj-text); font-weight:500;">${escapeHtml(email)}</span></div>
      <form id="tj-verify-form">
        <div style="margin-bottom:12px;">${fieldLabel('დაადასტურეთ კოდი')}<input type="text" name="token" inputmode="numeric" maxlength="8" required style="${inputStyle()}; text-align:center; letter-spacing:4px; font-size:18px;" placeholder="00000000"/></div>
        <button type="submit" style="width:100%; margin-top:6px; padding:10px; border-radius:8px; border:0.5px solid var(--tj-accent); background:rgba(230,185,77,0.18); color:var(--tj-text); font-size:13px; cursor:pointer;">დადასტურება</button>
        ${authMsgBox()}
      </form>

  // ===================== TAG PICKER (Setups / Vetoes / Market tags) =====================
  // kind: 'setups' | 'vetoes' | 'marketTags'
  function tagPickerHtml(kind, selected, extraClass){
    const list = settings[kind] || [];
    const chips = list.map(t => `<button type="button" class="tj-chip ${extraClass||''} ${selected.includes(t)?'sel':''}" data-tagpick="${kind}" data-val="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('');
    return `<div class="tj-tagpicker" data-kind="${kind}" style="display:flex; flex-wrap:wrap; gap:7px; align-items:center;">
      ${chips}
      <span style="display:inline-flex; gap:4px;">
        <input type="text" data-tagnew="${kind}" placeholder="+ ახალი..." style="width:120px; padding:6px 9px; border-radius:999px; border:0.5px dashed var(--tj-border); background:transparent; color:var(--tj-text); font-size:12px;"/>
      </span>
    </div>`;
  }
  function wireTagPicker(container, selectedArr, onChange){
    container.querySelectorAll('.tj-tagpicker').forEach(wrap => {
      const kind = wrap.dataset.kind;
      wrap.querySelectorAll('[data-tagpick]').forEach(chip => {
        chip.onclick = () => {
          const val = chip.dataset.val;
          const idx = selectedArr.indexOf(val);
          if (idx === -1) selectedArr.push(val); else selectedArr.splice(idx,1);
          chip.classList.toggle('sel');
          if (onChange) onChange();
        };
      });
      const input = wrap.querySelector(`[data-tagnew="${kind}"]`);
      if (input){
        input.addEventListener('keydown', async (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const val = input.value.trim();
          if (!val) return;
          if (!settings[kind].includes(val)){ settings[kind].push(val); await saveSettings(); }
          if (!selectedArr.includes(val)) selectedArr.push(val);
          input.value = '';
          const newChip = document.createElement('button');
          newChip.type = 'button';
          newChip.className = 'tj-chip sel' + (wrap.querySelector('.tj-chip.veto') ? ' veto' : '');
          if (wrap.dataset.kind === 'vetoes') newChip.classList.add('veto');
          newChip.dataset.tagpick = kind; newChip.dataset.val = val;
          newChip.textContent = val;
          wrap.insertBefore(newChip, input.parentElement);
          newChip.onclick = () => {
            const i = selectedArr.indexOf(val);
            if (i === -1) selectedArr.push(val); else selectedArr.splice(i,1);
            newChip.classList.toggle('sel');
            if (onChange) onChange();
          };
          if (onChange) onChange();
        });
      }
    });
  }

      tradeContext: '', tradeContextOther: '',
      riskPct: '', resultR: '', resultPoints: '', outcome: '',
      planAdherence: 'yes', screenshot: null, notes: ''

  function historicalStatFor(arrKey, values){
    if (!values || !values.length) return null;
    const matches = trades.filter(t => (t[arrKey]||[]).some(v => values.includes(v)) && t.outcome);
    if (matches.length < 3) return null;
    const wins = matches.filter(t=>t.outcome==='win').length;
    const avgR = matches.reduce((s,t)=>s+num(t.resultR),0)/matches.length;
    return { n: matches.length, winRate: Math.round(100*wins/matches.length), avgR };
  }

  // ===================== LOG =====================
  function getFilteredTrades(){
    return trades.filter(t=>{
      if (filters.instrument.length && !filters.instrument.includes(t.instrument)) return false;
      if (filters.direction.length && !filters.direction.includes(t.direction)) return false;
      if (filters.outcome.length && !filters.outcome.includes(t.outcome)) return false;
      if (filters.setup.length && !(t.setups||[]).some(s=>filters.setup.includes(s))) return false;
      if (filters.veto.length && !(t.vetoes||[]).some(v=>filters.veto.includes(v))) return false;
      if (filters.accountId.length && !filters.accountId.includes(t.accountId||'')) return false;
      if (filters.adherence.length && !filters.adherence.includes(t.planAdherence||'yes')) return false;
      if (filters.dateFrom && t.date < filters.dateFrom) return false;
      if (filters.dateTo && t.date > filters.dateTo) return false;
      return true;
    }).sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  }

  function selectStyle(){ return `padding:6px 9px; border-radius:7px; border:0.5px solid var(--tj-border); background:var(--tj-panel2); color:var(--tj-text); font-size:12px;`; }

  function filterDefs(){
    const instruments = Array.from(new Set(trades.map(t=>t.instrument).filter(Boolean)));
    return [

  function filtersActive(){ return filterDefs().some(d => filters[d.key].length > 0) || filters.dateFrom || filters.dateTo; }

  function wireFilterBar(onChange){
    const bar = bodyEl.querySelector('#tj-filterbar');
    if (!bar) return;
    bar.querySelectorAll('.tj-mf-box').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const key = cb.dataset.key; const arr = filters[key]; const idx = arr.indexOf(cb.value);
        if (cb.checked && idx===-1) arr.push(cb.value);
        if (!cb.checked && idx!==-1) arr.splice(idx,1);
        openFilterKey = key; onChange();
      });
    });
    bar.querySelectorAll('[data-f]').forEach(el=>{ el.addEventListener('change', ()=>{ filters[el.dataset.f] = el.value; onChange(); }); });
    const clearBtn = bodyEl.querySelector('#tj-clear-filters');
    if (clearBtn) clearBtn.onclick = () => { filters = { instrument:[], direction:[], outcome:[], setup:[], veto:[], accountId:[], adherence:[], dateFrom:'', dateTo:'' }; openFilterKey = null; onChange(); };

        ${(t.srTags&&t.srTags.length) ? `<div style="margin-bottom:6px; display:flex; flex-wrap:wrap; gap:6px;">${t.srTags.map(s=>`<span style="font-size:11px; padding:2px 9px; border-radius:999px; background:rgba(255,255,255,0.05); color:var(--tj-text2);">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
        ${t.marketNote ? `<div style="font-size:12.5px; color:var(--tj-text2); margin-bottom:4px;"><strong style="color:var(--tj-text3);">ბაზარი:</strong> ${escapeHtml(t.marketNote)}</div>` : ''}

  // ===================== STATS =====================
  function groupWinRate(items, keyFn, isArray){
    const groups = {};
    items.forEach(t=>{
      const keys = isArray ? (keyFn(t)||[]) : [keyFn(t)];
      keys.forEach(k=>{
        if (k===undefined || k===null || k==='') return;
        groups[k] = groups[k] || { win:0, total:0, sumR:0 };
        groups[k].total++;
        groups[k].sumR += num_(t);
        if (t.outcome==='win') groups[k].win++;
      });
    });
    function num_(t){ return num(t.resultR); }
    return Object.entries(groups).map(([k,v])=>({ key:k, n:v.total, winRate: Math.round(100*v.win/v.total), avgR: v.sumR/v.total }));
  }

  function sleepBucketLabel(h){
    if (h===null) return null;
    if (h < 5) return '< 5 სთ';
    if (h < 6) return '5–6 სთ';
    if (h < 7) return '6–7 სთ';
    if (h < 8) return '7–8 სთ';
    if (h < 9) return '8–9 სთ';
    return '9+ სთ';
  }

  function renderSleepCorrelation(closedTrades){
    const qualifyingDays = dailyReports.filter(r => r.bedtime && r.wakeTime);
    const html = [];
    html.push(`
      <div style="font-size:11.5px; color:var(--tj-text3); background:var(--tj-panel2); border-radius:8px; padding:10px 12px; line-height:1.6; margin-bottom:14px;">
        ზოგადი რეკომენდაცია: 7–9 საათი ძილი და მუდმივი გრაფიკი აუმჯობესებს კონცენტრაციასა და დისციპლინას. ქვემოთ - თქვენი პირადი მონაცემებზე დაფუძნებული ანალიზი, როცა საკმარისი ისტორია დაგროვდება.
      </div>`);
    if (qualifyingDays.length < 10){
      html.push(`<div style="font-size:12.5px; color:var(--tj-text2); margin-bottom:20px;">მონაცემები არასაკმარისია პერსონალიზებული ანალიზისთვის - შეავსეთ "დღის რეპორტი" (ძილის დროებით) მინიმუმ 10 დღეზე. ამჟამად: ${qualifyingDays.length}/10.</div>`);
      return html.join('');
    }
    const byDate = {};
    qualifyingDays.forEach(r => { byDate[r.date] = r; });
    const buckets = {};
    closedTrades.forEach(t=>{
      const rep = byDate[t.date];
      if (!rep) return;
      const h = sleepHoursBetween(rep.bedtime, rep.wakeTime);
      const label = sleepBucketLabel(h);
      if (!label) return;
      buckets[label] = buckets[label] || { win:0, total:0, sumR:0 };
      buckets[label].total++; buckets[label].sumR += num(t.resultR);
      if (t.outcome==='win') buckets[label].win++;
    });
    const bucketRows = Object.entries(buckets).map(([k,v])=>({ key:k, n:v.total, winRate: Math.round(100*v.win/v.total), avgR: v.sumR/v.total }));
    if (bucketRows.length){
      const best = bucketRows.slice().sort((a,b)=>b.avgR-a.avgR)[0];
      html.push(`<div style="background:var(--tj-panel); border:0.5px solid var(--tj-green); border-radius:10px; padding:14px 16px; margin-bottom:14px;">
        <div style="font-size:12px; color:var(--tj-green); font-weight:600; margin-bottom:6px;">თქვენი საუკეთესო ძილის ფანჯარა (ისტორიულად)</div>
        <div class="tj-serif" style="font-size:19px; font-weight:600;">${best.key}</div>
        <div style="font-size:12px; color:var(--tj-text3); margin-top:4px;">${best.winRate}% Win rate · საშ. ${fmtR(best.avgR)} (n=${best.n})</div>
      </div>`);
      html.push(renderBreakdownTable('შედეგები ძილის ხანგრძლივობის მიხედვით', bucketRows, 1));
    }
    // process goal correlation
    const goalGroups = { met:{n:0,sumR:0}, partial:{n:0,sumR:0}, missed:{n:0,sumR:0} };
    closedTrades.forEach(t=>{
      const rep = dailyReports.find(r=>r.date===t.date);
      if (!rep || !rep.goalResult) return;
      goalGroups[rep.goalResult].n++; goalGroups[rep.goalResult].sumR += num(t.resultR);
    });
    const goalRows = Object.entries(goalGroups).filter(([k,v])=>v.n>0).map(([k,v])=>({
      key: k==='met'?'მიზანი მიღწეული':k==='partial'?'ნაწილობრივ':'ვერ მოხერხდა', n:v.n, avgR: v.sumR/v.n
    }));
    if (goalRows.length > 1){
      html.push(`<div style="margin-bottom:10px; font-size:13px; font-weight:500;">შედეგი Process Goal-ის მიხედვით</div>`);
      html.push(`<div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;">${goalRows.map(r=>statChip(r.key, fmtR(r.avgR)+' (n='+r.n+')', r.avgR>=0?'var(--tj-green)':'var(--tj-red)')).join('')}</div>`);
    }
    return html.join('');
  }

  function renderStats(){
    let filtered = getFilteredTrades();
    if (trades.length === 0){
      bodyEl.innerHTML = `<div style="padding:40px 0; text-align:center; color:var(--tj-text2); font-size:13px;">ანალიტიკისთვის საჭიროა მინიმუმ ერთი ჩანაწერი.</div>`;
      return;
    }
    const closed = filtered.filter(t=>t.outcome);
    if (closed.length === 0){
      bodyEl.innerHTML = renderFilterBar() + `<div style="padding:40px 0; text-align:center; color:var(--tj-text2); font-size:13px;">ვერცერთი დახურული ტრეიდი ვერ მოიძებნა.</div>`;
      wireFilterBar(renderStats);
      return;
    }
    const n = closed.length;
    const wins = closed.filter(t=>t.outcome==='win');
    const losses = closed.filter(t=>t.outcome==='loss');
    const winRate = Math.round(100*wins.length/n);
    const totalR = closed.reduce((s,t)=>s+num(t.resultR),0);
    const avgR = totalR/n;
    const avgWinR = wins.length ? wins.reduce((s,t)=>s+num(t.resultR),0)/wins.length : 0;
    const avgLossR = losses.length ? losses.reduce((s,t)=>s+num(t.resultR),0)/losses.length : 0;
    const sumPosR = closed.filter(t=>num(t.resultR)>0).reduce((s,t)=>s+num(t.resultR),0);
    const sumNegR = closed.filter(t=>num(t.resultR)<0).reduce((s,t)=>s+num(t.resultR),0);
    const profitFactor = sumNegR !== 0 ? (sumPosR/Math.abs(sumNegR)) : (sumPosR>0?Infinity:0);
    const bestR = Math.max(...closed.map(t=>num(t.resultR)));
    const worstR = Math.min(...closed.map(t=>num(t.resultR)));

    let maxWinStreak=0, maxLossStreak=0, curWin=0, curLoss=0;
    closed.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(t=>{
      if (t.outcome==='win'){ curWin++; curLoss=0; maxWinStreak=Math.max(maxWinStreak,curWin); }
      else if (t.outcome==='loss'){ curLoss++; curWin=0; maxLossStreak=Math.max(maxLossStreak,curLoss); }
      else { curWin=0; curLoss=0; }
    });

    // outlier sensitivity
    let outlierDropPct = null;
    if (wins.length >= 1 && n >= 2 && avgR > 0){
      const maxWinR = Math.max(...wins.map(t=>num(t.resultR)));
      const expWithoutMax = (totalR - maxWinR) / (n - 1);
      const dropPct = (1 - (expWithoutMax / avgR)) * 100;
      if (dropPct > 50) outlierDropPct = Math.round(dropPct);
    }

    const riskedTrades = closed.filter(t=>num(t.riskPct)>0);
    const avgRiskPct = riskedTrades.length ? riskedTrades.reduce((s,t)=>s+num(t.riskPct),0)/riskedTrades.length : 0;

    const setupRows = groupWinRate(closed, t=>t.setups, true);
    const vetoRows = groupWinRate(closed, t=>t.vetoes, true);
    const instrumentRows = groupWinRate(closed, t=>t.instrument, false);
    const directionRows = groupWinRate(closed, t=>t.direction==='long'?'Long':'Short', false);
    const weekdayRows = groupWinRate(closed, t=>weekdayName(t.date), false);
    const adherenceRows = groupWinRate(closed, t=>t.planAdherence==='no'?'გეგმა დარღვეული':'გეგმა დაცული', false);

    const pointsByInstrument = {};
    filtered.forEach(t=>{
      if (!t.instrument || !t.resultPoints) return;
      pointsByInstrument[t.instrument] = pointsByInstrument[t.instrument] || { sum:0, n:0 };
      pointsByInstrument[t.instrument].sum += num(t.resultPoints);
      pointsByInstrument[t.instrument].n++;
    });

    let cum = 0;
    const equitySeries = closed.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(t => (cum += num(t.resultR)));

    const bins = [
      {label:'< -2R', test:r=>r<-2}, {label:'-2..-1R', test:r=>r>=-2&&r<-1}, {label:'-1..0R', test:r=>r>=-1&&r<0},
      {label:'0..1R', test:r=>r>=0&&r<1}, {label:'1..2R', test:r=>r>=1&&r<2}, {label:'2..3R', test:r=>r>=2&&r<3}, {label:'> 3R', test:r=>r>=3}
    ];
    const histLabels = bins.map(b=>b.label);
    const histData = bins.map(b=>closed.filter(t=>b.test(num(t.resultR))).length);

    bodyEl.innerHTML = renderFilterBar() + `
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
        <div style="font-size:13px; font-weight:500;">ძირითადი მაჩვენებლები</div>
        ${sampleBadge(n)}
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:20px;">
        ${metricCard('სულ ტრეიდი', n)}
        ${metricCard('Win rate', winRate + '%', 'var(--tj-green)')}
        ${metricCard('Profit factor', isFinite(profitFactor) ? profitFactor.toFixed(2) : '∞', profitFactor>=1.5?'var(--tj-green)':profitFactor>=1?'var(--tj-amber)':'var(--tj-red)')}
        ${metricCard('Expectancy (R)', fmtR(avgR), avgR>=0?'var(--tj-green)':'var(--tj-red)')}
        ${metricCard('ჯამური R', fmtR(totalR), totalR>=0?'var(--tj-green)':'var(--tj-red)')}
        ${metricCard('საშ. Win', fmtR(avgWinR), 'var(--tj-green)')}
        ${metricCard('საშ. Loss', fmtR(avgLossR), 'var(--tj-red)')}
        ${metricCard('საშ. რისკი/ტრეიდი', avgRiskPct.toFixed(2)+'%')}
      </div>

      ${outlierDropPct ? `<div style="background:rgba(217,125,61,0.1); border:0.5px solid var(--tj-amber); border-radius:10px; padding:12px 16px; margin-bottom:20px; font-size:12.5px; color:var(--tj-text2);">⚠ Expectancy მნიშვნელოვნად არის დამოკიდებული ერთ საუკეთესო ტრეიდზე - მისი გამორიცხვისას Expectancy იკლებს ${outlierDropPct}%-ით. საჭიროა მეტი მონაცემი საიმედო დასკვნისთვის.</div>` : ''}

      <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:24px;">
        ${statChip('საშ. Win R', '+'+avgWinR.toFixed(2)+'R', 'var(--tj-green)')}
        ${statChip('საშ. Loss R', avgLossR.toFixed(2)+'R', 'var(--tj-red)')}
        ${statChip('საუკეთესო R', fmtR(bestR), 'var(--tj-green)')}
        ${statChip('უარესი R', fmtR(worstR), 'var(--tj-red)')}
        ${statChip('მაქს. Win streak', maxWinStreak, 'var(--tj-green)')}
        ${statChip('მაქს. Loss streak', maxLossStreak, 'var(--tj-red)')}
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:24px; margin-bottom:24px;">
        <div>
          <div style="font-size:13px; font-weight:500; margin-bottom:8px;">Equity Curve (R, კუმულაციური)</div>
          <div style="position:relative; height:200px;"><canvas id="tj-equity"></canvas></div>
        </div>
        <div>
          <div style="font-size:13px; font-weight:500; margin-bottom:8px;">R განაწილება</div>
          <div style="position:relative; height:200px;"><canvas id="tj-histogram"></canvas></div>
        </div>
      </div>

      ${Object.keys(pointsByInstrument).length ? `
      <div style="margin-bottom:22px;">
        <div style="font-size:13px; font-weight:500; margin-bottom:10px;">პოინტები ინსტრუმენტის მიხედვით</div>
        <div style="display:flex; flex-wrap:wrap; gap:10px;">
          ${Object.entries(pointsByInstrument).map(([k,v])=>statChip(k, (v.sum>=0?'+':'')+v.sum.toFixed(1)+' pts (n='+v.n+')', v.sum>=0?'var(--tj-green)':'var(--tj-red)')).join('')}
        </div>
      </div>` : ''}

      ${renderBreakdownTable('Setup-ების მიხედვით', setupRows, 3)}
      ${renderBreakdownTable('Veto პირობების მიხედვით (როცა გააქტიურდა)', vetoRows, 3)}
      ${renderBreakdownTable('ინსტრუმენტების მიხედვით', instrumentRows, 3)}
      ${renderBreakdownTable('მიმართულების მიხედვით', directionRows, 1)}
      ${renderBreakdownTable('კვირის დღის მიხედვით', weekdayRows, 3)}
      ${renderBreakdownTable('გეგმის დაცვის მიხედვით', adherenceRows, 1)}

      <div style="margin-bottom:10px; font-size:13px; font-weight:500;">ძილი და შედეგები</div>
      ${renderSleepCorrelation(closed)}
    `;
    wireFilterBar(renderStats);

    if (!window.Chart){
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js';
      s.onload = drawCharts;
      document.body.appendChild(s);
    } else drawCharts();

    function drawCharts(){
      const gridColor = '#342C1F', textColor = '#A79C86';
      function mkChart(id, config){ const el = document.getElementById(id); if (!el) return; new Chart(el, config); }
      mkChart('tj-equity', {
        type:'line',
        data:{ labels: equitySeries.map((_,i)=>i+1), datasets:[{ data: equitySeries, borderColor:'#E6B94D', backgroundColor:'rgba(230,185,77,0.12)', fill:true, tension:0.15, pointRadius:2, borderWidth:2 }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{color:gridColor},ticks:{color:textColor,font:{size:10}}}, y:{grid:{color:gridColor},ticks:{color:textColor,font:{size:10}}} } }
      });
      mkChart('tj-histogram', {
        type:'bar',
        data:{ labels: histLabels, datasets:[{ data: histData, backgroundColor:'#E6B94D' }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false},ticks:{color:textColor,font:{size:10}}}, y:{grid:{color:gridColor},ticks:{color:textColor,font:{size:10}}} } }
      });
    }
  }

  // ===================== AI ANALYSIS =====================
  let aiLoading = false, aiError = '', aiResult = '';
  function renderAI(){
    const closed = trades.filter(t=>t.outcome);
    bodyEl.innerHTML = `
      <div class="tj-serif" style="font-size:17px; font-weight:600; margin-bottom:6px;">AI ანალიზი</div>
      <div style="font-size:12.5px; color:var(--tj-text2); margin-bottom:20px; line-height:1.6;">AI აანალიზებს თქვენს საკუთარ ტრეიდებს, Setup/Veto ტეგებს და დღის რეპორტებს (ძილი, პროცესის მიზნები) და პოულობს პატერნებს - მეთოდოლოგიის ცოდნის გარეშე, მხოლოდ თქვენს მონაცემებზე დაყრდნობით.</div>
      <button id="tj-ai-run" type="button" style="padding:10px 22px; border-radius:8px; border:0.5px solid var(--tj-accent); background:rgba(230,185,77,0.18); color:var(--tj-text); font-size:13px; cursor:pointer;" ${closed.length<10?'disabled':''}>${aiLoading ? 'მუშავდება…' : 'ანალიზის გაშვება'}</button>
      ${closed.length<10 ? `<div style="margin-top:10px; font-size:12px; color:var(--tj-text3);">საჭიროა მინიმუმ 10 დახურული ტრეიდი (ამჟამად: ${closed.length}).</div>` : ''}
      <div id="tj-ai-out" style="margin-top:20px;"></div>
    `;
    const out = bodyEl.querySelector('#tj-ai-out');
    if (aiError) out.innerHTML = `<div style="color:var(--tj-red); font-size:13px;">${escapeHtml(aiError)}</div>`;
    if (aiResult){
      out.innerHTML = `<div class="tj-ai-card"><div class="tj-ai-card-header"><div class="tj-ai-icon">✦</div><div><div class="tj-ai-title">პერსონალური ანალიზი</div><div class="tj-ai-sub">დაფუძნებულია თქვენს ჟურნალზე</div></div></div><div class="tj-ai-content">${window.marked ? marked.parse(aiResult) : escapeHtml(aiResult)}</div></div>`;
    }
    const btn = bodyEl.querySelector('#tj-ai-run');
    if (btn) btn.onclick = async () => {
      aiLoading = true; aiError=''; renderAI();
      try {
        const setupStats = groupWinRate(closed, t=>t.setups, true);
        const vetoStats = groupWinRate(closed, t=>t.vetoes, true);
        const sleepDays = dailyReports.filter(r=>r.bedtime && r.wakeTime).map(r=>({
          date:r.date, sleepHours: sleepHoursBetween(r.bedtime,r.wakeTime), goalResult:r.goalResult, energy:r.energy, stress:r.stress
        }));
        const payload = {
          summary: {
            n: closed.length,
            winRate: Math.round(100*closed.filter(t=>t.outcome==='win').length/closed.length),
            avgR: closed.reduce((s,t)=>s+num(t.resultR),0)/closed.length
          },
          setupStats, vetoStats,
          trades: closed.slice(-150).map(t=>({ date:t.date, instrument:t.instrument, direction:t.direction, setups:t.setups, vetoes:t.vetoes, resultR:num(t.resultR), riskPct:num(t.riskPct), planAdherence:t.planAdherence, marketTags:t.marketTags })),
          dailyReports: sleepDays
        };
        const { data, error } = await supabase.functions.invoke('analyze-trades', { body: payload });
        if (error) throw error;
        aiResult = (data && data.comment) || 'პასუხი ვერ მოვიდა.';
      } catch(e){
        aiError = 'ანალიზის გაშვება ვერ მოხერხდა: ' + (e && e.message ? e.message : 'უცნობი შეცდომა');
      }
      aiLoading = false; renderAI();
    };
  }

  // ===================== GUIDE =====================
  function renderGuide(){
    bodyEl.innerHTML = `
      <div class="tj-serif" style="font-size:17px; font-weight:600; margin-bottom:14px;">ინსტრუქცია</div>
      <div class="tj-ai-content" style="font-size:13.5px;">
        <h2>უნივერსალური ჟურნალი</h2>
        <p>ეს ჟურნალი არ არის მიბმული კონკრეტულ მეთოდოლოგიაზე. "პარამეტრებში" თავად განსაზღვრეთ თქვენი Setup-ები, Veto პირობები, ბაზრის სიტუაციის ტეგები და ინსტრუმენტები - ისინი შემდეგ გამოჩნდება ტრეიდის დამატებისას და ანალიტიკაში.</p>
        <h2>ფასების ნაცვლად - R და პოინტები</h2>
        <p>ჟურნალში აღარ ინახება კონკრეტული ფასები (Entry/Stop/Target). შედეგი ფიქსირდება მხოლოდ R მულტიპლში (თქვენს რისკთან შეფარდებით) და პოინტებში, ხოლო რისკი - ანგარიშის ბალანსის პროცენტულ წილად. ეს ჟურნალს ინსტრუმენტისგან დამოუკიდებელს და უნივერსალურს ხდის.</p>
        <h2>დღის რეპორტი (Daily Report Card)</h2>
        <p>ავსეთ ყოველდღე, ტრეიდის არსებობის მიუხედავად. მთავარი აქცენტი არის ერთი, კონკრეტული პროცესის მიზანი დღეში (არა შედეგი/მოგება) და მისი პატიოსანი თვითშეფასება დღის ბოლოს.</p>
        <h2>ძილის კონტროლი</h2>
        <p>მიუთითეთ დაძინების და გაღვიძების დრო ყოველდღე. მინიმუმ 10 დღის მონაცემის დაგროვების შემდეგ, ანალიტიკის გვერდზე ავტომატურად გამოჩნდება, ძილის რომელ ხანგრძლივობაზე გაქვთ საუკეთესო სავაჭრო შედეგები.</p>
        <h2>AI ანალიზი</h2>
        <p>AI აანალიზებს მხოლოდ თქვენს საკუთარ მონაცემებს (Setup/Veto ტეგები, R შედეგები, ძილი, Process Goal-ები) - მას არ აქვს ჩაშენებული არცერთი კონკრეტული სავაჭრო მეთოდოლოგია.</p>
      </div>
    `;
  }

  // ===================== ROUTER =====================
  function renderBody(){
    if (tab === 'new') renderNewTrade();
    else if (tab === 'drc') renderDRC();
    else if (tab === 'log') renderLog();
    else if (tab === 'stats') renderStats();
    else if (tab === 'ai') renderAI();
    else if (tab === 'settings') renderSettings();
    else if (tab === 'accounts') renderAccounts();
    else renderGuide();
    bodyEl.classList.remove('tj-fadein');
    void bodyEl.offsetWidth;
    bodyEl.classList.add('tj-fadein');
  }

  // ===================== DATA (Supabase) =====================
  const statusEl = root.querySelector('#tj-status');
  function showStatus(text, kind){
    statusEl.style.display = 'block';
    statusEl.style.color = kind==='error' ? 'var(--tj-red)' : kind==='ok' ? 'var(--tj-green)' : 'var(--tj-text2)';
    statusEl.textContent = text;
  }

  async function loadTrades(){
    if (!currentUser){ trades = []; return; }
    try {
      const { data, error } = await supabase.from('trades').select('id, data').eq('user_id', currentUser.id).order('created_at', { ascending: true });
      if (error) throw error;
      trades = (data || []).map(row => ({ ...row.data, id: row.id }));
    } catch(e){ trades = []; showStatus('ტრეიდების ჩატვირთვა ვერ მოხერხდა: ' + (e && e.message ? e.message : 'უცნობი შეცდომა'), 'error'); }
  }
  async function addTradeRemote(tradeObj){
    if (!currentUser){ showStatus('გთხოვთ, ჯერ შეხვიდეთ ანგარიშში.', 'error'); return false; }
    try {
      const { data, error } = await supabase.from('trades').insert({ user_id: currentUser.id, data: tradeObj }).select('id, data').single();
      if (error) throw error;
      trades.push({ ...data.data, id: data.id });
      statusEl.style.display = 'none';
      return true;
    } catch(e){ showStatus('შენახვის შეცდომა: ' + (e && e.message ? e.message : 'უცნობი'), 'error'); return false; }
  }
  async function updateTradeRemote(id, tradeObj){
    if (!currentUser) return false;
    try {
      const { error } = await supabase.from('trades').update({ data: tradeObj }).eq('id', id).eq('user_id', currentUser.id);
      if (error) throw error;
      const idx = trades.findIndex(t => t.id === id);
      if (idx !== -1) trades[idx] = { ...tradeObj, id };
      statusEl.style.display = 'none';
      return true;
    } catch(e){ showStatus('განახლების შეცდომა: ' + (e && e.message ? e.message : 'უცნობი'), 'error'); return false; }
  }
  async function deleteTradeRemote(id){
    if (!currentUser) return false;
    try {
      const { error } = await supabase.from('trades').delete().eq('id', id).eq('user_id', currentUser.id);
      if (error) throw error;
      trades = trades.filter(t => t.id !== id);
      return true;
    } catch(e){ showStatus('წაშლის შეცდომა: ' + (e && e.message ? e.message : 'უცნობი'), 'error'); return false; }
  }

  async function loadDailyReports(){
    if (!currentUser){ dailyReports = []; return; }
    try {
      const { data, error } = await supabase.from('daily_reports').select('id, date, data').eq('user_id', currentUser.id).order('date', { ascending:true });
      if (error) throw error;
      dailyReports = (data||[]).map(row => ({ ...row.data, date: row.date, id: row.id }));
    } catch(e){ dailyReports = []; }
  }
  async function saveDailyReport(reportObj){
    if (!currentUser) return false;
    try {
      const { error } = await supabase.from('daily_reports').upsert(
        { user_id: currentUser.id, date: reportObj.date, data: reportObj },
        { onConflict: 'user_id,date' }
      );
      if (error) throw error;
      dailyReports = dailyReports.filter(r=>r.date!==reportObj.date);
      dailyReports.push(reportObj);
      return true;
    } catch(e){ showStatus('დღის რეპორტის შენახვის შეცდომა: ' + (e && e.message ? e.message : 'უცნობი'), 'error'); return false; }
  }

  async function loadSettings(){
    if (!currentUser) return;
    try {
      const { data, error } = await supabase.from('journal_settings').select('data').eq('user_id', currentUser.id).maybeSingle();
      if (error) throw error;
      if (data && data.data) settings = Object.assign({ setups:[], vetoes:[], marketTags:[], srTags:[], instruments:[] }, data.data);
    } catch(e){ /* keep defaults */ }
  }
  async function saveSettings(){
    if (!currentUser) return false;
    try {
      const { error } = await supabase.from('journal_settings').upsert({ user_id: currentUser.id, data: settings }, { onConflict: 'user_id' });
      if (error) throw error;
      return true;
    } catch(e){ return false; }
  }

  async function startApp(){
    await Promise.all([loadTrades(), loadDailyReports(), loadSettings()]);
    renderTabs();
    renderBody();
  }

  (async function bootstrap(){
    renderAuthTabs();
    renderAuthBody();
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (session && session.user) await onAuthSuccess(session.user);
    } catch(e){ showStatus('Supabase-თან დაკავშირება ვერ მოხერხდა.', 'error'); }
  })();
})();
</script>
