<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal - Traders Academy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/IBM-Plex/1.0.0/IBM-Plex-Mono/css/ibm-plex-mono.min.css">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #14120E; min-height: 100vh; }
  body { font-family: 'Inter', -apple-system, sans-serif; }
  .tj { --tj-bg: #14120E; --tj-panel: #1C1913; --tj-panel2: #221D16; --tj-border: #302A1F;
    --tj-text: #F2EEE4; --tj-text2: #B4AB9A; --tj-text3: #8A8170;
    --tj-accent: #E6B94D; --tj-accent-light: #F2D98A; --tj-accent-soft: #A9853C;
    --tj-green: #5FA876; --tj-red: #C15D4C; --tj-amber: #D97D3D;
    /* motion system: consistent durations + one shared easing family across the app */
    --tj-ease: cubic-bezier(0.22,1,0.36,1);
    --tj-ease-in: cubic-bezier(0.4,0,1,1);
    --tj-fast: 160ms; --tj-micro: 220ms; --tj-standard: 340ms; --tj-complex: 480ms;
    color: var(--tj-text); background: var(--tj-bg); min-height: 100vh; }
  @media (prefers-reduced-motion: reduce) {
    .tj, .tj *, .tj *::before, .tj *::after { animation-duration: 0.001ms !important; animation-delay: 0ms !important; transition-duration: 0.001ms !important; }
  }
  .tj :where(input, select, textarea, button) { font-family: inherit; }
  .tj-mono { font-family: 'IBM Plex Mono', monospace; }
  .tj-serif { font-family: 'Source Serif 4', Georgia, serif; }
  .tj :where(input, select, textarea) { min-height: 38px; font-size: 15px; }
  .tj button { min-height: 36px; }
  .tj input, .tj select, .tj textarea { width:100%; padding:8px 10px; border-radius:8px; border:0.5px solid var(--tj-border); background:var(--tj-panel2); color:var(--tj-text); font-size:13px; }
  .tj input:focus, .tj select:focus, .tj textarea:focus { outline:none; border-color:var(--tj-accent); box-shadow:0 0 0 2px rgba(230,185,77,0.14); }
  .tj ::selection { background: rgba(230,185,77,0.28); }

  /* ---- shell ---- */
  #tj-shell { display:flex; min-height:100vh; }
  #tj-sidebar { width:220px; flex-shrink:0; background:var(--tj-panel); border-right:0.5px solid var(--tj-border); display:flex; flex-direction:column; transition:width var(--tj-standard) var(--tj-ease); overflow:hidden; }
  #tj-sidebar.collapsed { width:64px; }
  #tj-sidebar-head { padding:20px 18px; display:flex; align-items:center; justify-content:space-between; gap:8px; border-bottom:0.5px solid var(--tj-border); }
  #tj-sidebar-logo { font-family:'Source Serif 4',Georgia,serif; font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; transition:opacity var(--tj-fast) ease; }
  #tj-sidebar-toggle { background:none; border:none; color:var(--tj-text3); cursor:pointer; font-size:15px; padding:4px; min-height:auto; transition:color var(--tj-fast) ease, transform var(--tj-fast) ease; }
  #tj-sidebar-toggle:hover { color:var(--tj-text); }
  #tj-sidebar-toggle:active { transform:scale(0.88); }
  #tj-nav { position:relative; flex:1; padding:10px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; overflow-x:hidden; }
  #tj-nav-indicator { position:absolute; left:10px; right:10px; border-radius:9px; background:rgba(169,133,60,0.16); border:0.5px solid rgba(230,185,77,0.32); z-index:0; pointer-events:none; transition:transform var(--tj-standard) var(--tj-ease), height var(--tj-standard) var(--tj-ease); }
  .tj-nav-item { position:relative; z-index:1; display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:9px; color:var(--tj-text2); text-decoration:none; cursor:pointer; font-size:13.5px; white-space:nowrap; border:none; background:transparent; width:100%; text-align:left; transition:background var(--tj-fast) ease, color var(--tj-fast) ease, transform 120ms ease; }
  .tj-nav-item:hover { background:rgba(255,255,255,0.03); color:var(--tj-text); }
  .tj-nav-item.active { color:var(--tj-text); }
  .tj-nav-item:active { transform:scale(0.985); }
  .tj-nav-item .tj-nav-icon { width:18px; height:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; transition:transform var(--tj-micro) var(--tj-ease); }
  .tj-nav-item.active .tj-nav-icon { transform:scale(1.08); }
  .tj-nav-label { transition:opacity var(--tj-fast) ease; }
  #tj-sidebar.collapsed .tj-nav-label, #tj-sidebar.collapsed #tj-sidebar-logo { opacity:0; pointer-events:none; }
  #tj-sidebar-foot { padding:14px 16px; border-top:0.5px solid var(--tj-border); font-size:11.5px; color:var(--tj-text3); white-space:nowrap; overflow:hidden; transition:opacity var(--tj-fast) ease; }
  #tj-main { flex:1; min-width:0; display:flex; flex-direction:column; }
  #tj-main { transition:filter var(--tj-standard) var(--tj-ease), transform var(--tj-standard) var(--tj-ease), opacity var(--tj-standard) var(--tj-ease); }
  #tj-main.tj-dimmed { filter:blur(2px); transform:scale(0.99); opacity:0.7; }
  #tj-topbar { padding:16px 28px; border-bottom:0.5px solid var(--tj-border); display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  #tj-topbar-title { font-family:'Source Serif 4',Georgia,serif; font-size:18px; font-weight:600; }
  #tj-topbar-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  #tj-status { padding:9px 28px; font-size:12px; border-bottom:0.5px solid var(--tj-border); display:none; }
  #tj-body { padding:24px 28px 40px; }
  @keyframes tjFadeUp { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
  @keyframes tjFadeOut { to { opacity:0; transform:translateY(-6px);} }
  #tj-body.tj-fadein { animation: tjFadeUp var(--tj-complex) var(--tj-ease) both; }
  #tj-body.tj-page-exit { animation: tjFadeOut var(--tj-fast) var(--tj-ease-in) forwards; }
  @keyframes tjRise { from { opacity:0; transform:translateY(14px) scale(0.98);} to { opacity:1; transform:translateY(0) scale(1);} }
  .tj-rise { animation: tjRise var(--tj-complex) var(--tj-ease) both; animation-delay: var(--tj-delay, 0ms); }
  @media (max-width: 880px) {
    #tj-sidebar { position:fixed; z-index:60; top:0; bottom:0; left:0; width:220px; transform:translateX(-100%); transition:transform 0.22s ease; }
    #tj-sidebar.mobile-open { transform:translateX(0); }
    #tj-sidebar.collapsed { width:220px; }
    #tj-mobile-burger { display:flex !important; }
    #tj-body { padding:16px 14px 30px; }
    #tj-topbar { padding:14px 16px; }
  }
  #tj-mobile-burger { display:none; background:none; border:0.5px solid var(--tj-border); border-radius:8px; color:var(--tj-text); width:36px; height:36px; align-items:center; justify-content:center; cursor:pointer; font-size:16px; }
  #tj-scrim { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:55; }
  #tj-scrim.show { display:block; }

  /* ---- generic ---- */
  select.tj-select-sm, .tj-select-sm { padding:6px 10px; border-radius:7px; font-size:12px; }
  .tj-btn { padding:8px 16px; border-radius:8px; font-size:13px; cursor:pointer; border:0.5px solid var(--tj-border); background:transparent; color:var(--tj-text2); transition:border-color var(--tj-fast) ease, background var(--tj-fast) ease, color var(--tj-fast) ease, transform 120ms ease, filter var(--tj-fast) ease; }
  .tj-btn:hover { border-color:var(--tj-accent-soft); color:var(--tj-text); filter:brightness(1.06); }
  .tj-btn:active { transform:scale(0.97); }
  .tj-btn.primary { border-color:var(--tj-accent); background:rgba(230,185,77,0.16); color:var(--tj-text); }
  .tj-btn.primary:hover { background:rgba(230,185,77,0.24); }
  .tj-btn.active { border-color:var(--tj-accent); background:rgba(230,185,77,0.15); color:var(--tj-text); }
  .tj-btn:disabled { opacity:0.6; cursor:default; transform:none !important; }
  .tj-panelcard { background:var(--tj-panel); border:0.5px solid var(--tj-border); border-radius:12px; transition:box-shadow var(--tj-micro) var(--tj-ease), border-color var(--tj-micro) var(--tj-ease), transform var(--tj-micro) var(--tj-ease); }
  .tj-panelcard:hover { box-shadow:0 10px 22px rgba(0,0,0,0.24); border-color:rgba(169,133,60,0.5); transform:translateY(-3px); }
  .tj-chip { padding:6px 12px; border-radius:999px; font-size:12.5px; cursor:pointer; border:0.5px solid var(--tj-border); background:transparent; color:var(--tj-text2); display:inline-flex; align-items:center; gap:6px; transition:border-color var(--tj-fast) ease, background var(--tj-fast) ease, color var(--tj-fast) ease, transform 120ms ease; }
  .tj-chip:hover { border-color:var(--tj-accent); color:var(--tj-text); }
  .tj-chip:active { transform:scale(0.95); }
  .tj-chip.sel { border-color:var(--tj-accent); background:rgba(230,185,77,0.16); color:var(--tj-text); }
  .tj-chip.veto.sel { border-color:var(--tj-red); background:rgba(193,93,76,0.14); color:var(--tj-text); }
  .tj-chip-del { opacity:0.5; font-size:11px; cursor:pointer; }
  .tj-chip-del:hover { opacity:1; color:var(--tj-red); }
  .tj-badge { font-size:10.5px; padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .tj-spin { display:inline-block; width:12px; height:12px; border-radius:50%; border:2px solid rgba(255,255,255,0.25); border-top-color:currentColor; animation:tjSpin 0.7s linear infinite; vertical-align:-2px; margin-right:7px; }
  @keyframes tjSpin { to { transform:rotate(360deg); } }
  @keyframes tjPop { 0%{ transform:scale(0.5); opacity:0; } 60%{ transform:scale(1.12); opacity:1; } 100%{ transform:scale(1); } }
  .tj-check-pop { display:inline-block; animation: tjPop 0.36s var(--tj-ease) both; }

  /* ---- kpi cards ---- */
  .tj-kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .tj-kpi { padding:16px 18px; }
  .tj-kpi-label { font-size:11px; color:var(--tj-text2); margin-bottom:8px; letter-spacing:0.02em; }
  .tj-kpi-value { font-size:22px; font-weight:600; font-family:'IBM Plex Mono',monospace; }
  .tj-kpi-sub { font-size:11px; color:var(--tj-text3); margin-top:4px; }
  .tj-kpi-spark { height:28px; margin-top:8px; }

  /* ---- ring ---- */
  .tj-ring { transform:rotate(-90deg); }
  .tj-ring-bg { fill:none; stroke:var(--tj-border); }
  .tj-ring-fg { fill:none; stroke:var(--tj-accent); stroke-linecap:round; transition:stroke-dashoffset 0.9s var(--tj-ease); }

  /* ---- table ---- */
  .tj-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .tj-table th { text-align:left; padding:9px 10px; color:var(--tj-text3); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; border-bottom:0.5px solid var(--tj-border); white-space:nowrap; }
  .tj-table td { padding:10px 10px; border-bottom:0.5px solid var(--tj-border); white-space:nowrap; }
  .tj-table tbody tr { cursor:pointer; transition:background var(--tj-fast) ease; }
  .tj-table tbody tr:hover { background:rgba(255,255,255,0.025); }
  .tj-table tbody tr.tj-row-selected { background:rgba(230,185,77,0.09); box-shadow:inset 2px 0 0 var(--tj-accent); }
  .tj-table-wrap { overflow-x:auto; }

  /* ---- drawer ---- */
  #tj-drawer-scrim { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:90; opacity:0; transition:opacity var(--tj-standard) var(--tj-ease); }
  #tj-drawer-scrim.show { display:block; opacity:1; }
  #tj-drawer { position:fixed; top:0; right:0; bottom:0; width:min(460px,92vw); background:var(--tj-panel); border-left:0.5px solid var(--tj-border); z-index:91; transform:translateX(100%); transition:transform var(--tj-complex) var(--tj-ease); overflow-y:auto; padding:22px 22px 40px; }
  #tj-drawer.show { transform:translateX(0); }
  #tj-drawer.show > * { animation: tjFadeUp var(--tj-standard) var(--tj-ease) both; animation-delay:60ms; }
  .tj-drawer-close { position:absolute; top:18px; right:18px; background:var(--tj-panel2); border:none; color:var(--tj-text); border-radius:7px; width:30px; height:30px; cursor:pointer; font-size:14px; transition:transform var(--tj-fast) ease, background var(--tj-fast) ease; }
  .tj-drawer-close:hover { background:var(--tj-border); }
  .tj-drawer-close:active { transform:scale(0.88) rotate(90deg); }
  .tj-drawer-row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:0.5px solid var(--tj-border); font-size:12.5px; }
  .tj-drawer-row span:first-child { color:var(--tj-text3); }
  .tj-drawer-row span:last-child { color:var(--tj-text); font-family:'IBM Plex Mono',monospace; }

  /* ---- calendar ---- */
  .tj-cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .tj-cal-cell { aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10.5px; color:var(--tj-text3); cursor:pointer; position:relative; transition:transform var(--tj-fast) ease, box-shadow var(--tj-fast) ease; animation: tjFadeUp var(--tj-micro) var(--tj-ease) both; animation-delay: calc(var(--i, 0) * 8ms); }
  .tj-cal-cell:hover { transform:scale(1.12); box-shadow:0 4px 10px rgba(0,0,0,0.3); z-index:2; }
  .tj-cal-cell.has-data { color:#fff; font-weight:600; }

  .tj-lightbox { display:none; position:fixed; inset:0; z-index:1000; background:rgba(10,11,13,0.85); align-items:center; justify-content:center; padding:24px; }
  .tj-drc-strip-day { width:16px; height:16px; border-radius:4px; flex-shrink:0; transition:transform var(--tj-fast) ease; }
  .tj-drc-strip-day:hover { transform:scale(1.25); }
  .tj-rate { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:8px; border:0.5px solid var(--tj-border); background:transparent; color:var(--tj-text2); font-size:12px; cursor:pointer; font-family:'IBM Plex Mono',monospace; transition:transform 120ms ease, border-color var(--tj-fast) ease, background var(--tj-fast) ease; }
  .tj-rate:hover { border-color:var(--tj-accent-soft); }
  .tj-rate:active { transform:scale(0.9); }
  .tj-rate.sel { border-color:var(--tj-accent); background:rgba(230,185,77,0.18); color:var(--tj-text); }

  /* ---- dropdown / details popover ---- */
  @keyframes tjPopIn { from { opacity:0; transform:scale(0.97) translateY(-4px); } to { opacity:1; transform:scale(1) translateY(0); } }
  details[open] > .tj-dropdown-pop { animation: tjPopIn var(--tj-micro) var(--tj-ease) both; transform-origin:top left; }

  /* ---- empty state ---- */
  @keyframes tjFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  .tj-empty-icon { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:12px; background:rgba(230,185,77,0.1); border:0.5px solid rgba(230,185,77,0.22); color:var(--tj-accent); font-size:18px; margin-bottom:14px; animation: tjFloat 3.2s ease-in-out infinite; }

  /* ---- toasts ---- */
  #tj-toasts { position:fixed; top:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:min(340px,88vw); }
  .tj-toast { display:flex; align-items:center; gap:9px; padding:12px 14px; border-radius:10px; background:var(--tj-panel); border:0.5px solid var(--tj-border); box-shadow:0 10px 26px rgba(0,0,0,0.35); font-size:12.5px; color:var(--tj-text); opacity:0; transform:translateX(24px); transition:opacity var(--tj-standard) var(--tj-ease), transform var(--tj-standard) var(--tj-ease); }
  .tj-toast.show { opacity:1; transform:translateX(0); }
  .tj-toast.ok { border-color:rgba(95,168,118,0.5); }
  .tj-toast.error { border-color:rgba(193,93,76,0.5); }
  .tj-toast-icon { flex-shrink:0; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .tj-toast.ok .tj-toast-icon { background:rgba(95,168,118,0.18); color:var(--tj-green); }
  .tj-toast.error .tj-toast-icon { background:rgba(193,93,76,0.18); color:var(--tj-red); }
  .tj-toast.info .tj-toast-icon { background:rgba(230,185,77,0.18); color:var(--tj-accent); }

  .tj-ai-card { background:var(--tj-panel); border:0.5px solid var(--tj-border); border-radius:14px; padding:26px 28px; }
  .tj-ai-card-header { display:flex; align-items:center; gap:10px; margin-bottom:18px; padding-bottom:14px; border-bottom:0.5px solid var(--tj-border); }
  .tj-ai-icon { width:24px; height:24px; border-radius:8px; background:linear-gradient(135deg,var(--tj-accent),var(--tj-accent-light)); display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
  .tj-ai-title { font-family:'Source Serif 4',Georgia,serif; font-size:15px; font-weight:600; }
  .tj-ai-sub { font-size:11px; color:var(--tj-text3); }
  .tj-ai-content { font-size:13.5px; line-height:1.8; color:var(--tj-text2); }
  .tj-ai-content h1,.tj-ai-content h2,.tj-ai-content h3 { color:var(--tj-text); font-family:'Source Serif 4',Georgia,serif; font-weight:600; }
  .tj-ai-content h2 { font-size:15px; margin:22px 0 10px; }
  .tj-ai-content h2:first-child { margin-top:0; }
  .tj-ai-content p { margin:0 0 12px; }
  .tj-ai-content strong { color:var(--tj-text); }
  .tj-ai-content table { width:100%; border-collapse:collapse; font-size:12.5px; margin:12px 0; }
  .tj-ai-content th,.tj-ai-content td { padding:7px 9px; border-bottom:0.5px solid var(--tj-border); text-align:left; }

  @media (max-width: 640px) {
    .tj-kpi-grid { grid-template-columns:1fr 1fr; }
    .tj-table th:nth-child(n+7), .tj-table td:nth-child(n+7) { display:none; }
  }
</style>
</head>

    <div style="position:relative; max-width:min(1100px,94vw); max-height:90vh; width:100%; background:var(--tj-panel); border:0.5px solid var(--tj-border); border-radius:12px; padding:14px; display:flex; flex-direction:column;">
      <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
        <button id="tj-lightbox-close" type="button" style="border:none; background:var(--tj-panel2); color:var(--tj-text); border-radius:6px; width:28px; height:28px; cursor:pointer;">✕</button>
      </div>
      <div id="tj-lightbox-content" style="flex:1; min-height:200px; display:flex; align-items:center; justify-content:center; overflow:auto;"></div>
    </div>
  </div>
</div>

<script>
(function(){
  // ================= STATE =================
  let currentUser = null;
  let authTab = 'login';
  let page = 'dashboard';
  let trades = [];
  let dailyReports = [];
  let editingTradeId = null;
  let drcDate = todayStr();
  let sidebarCollapsed = false;
  let dashRange = '30'; // days, or 'all'
  let dashAccountId = '';

  let settings = { setups:[], vetoes:[], marketTags:[], srTags:[], instruments:[], pointValues:{} };

  let accounts = (function(){ try { return JSON.parse(localStorage.getItem('tj_accounts_v3')) || []; } catch(e){ return []; } })();
  function persistAccounts(){ try { localStorage.setItem('tj_accounts_v3', JSON.stringify(accounts)); } catch(e){} }

  let filters = { instrument:[], direction:[], outcome:[], setup:[], veto:[], accountId:[], adherence:[], session:[], dateFrom:'', dateTo:'' };
  let openFilterKey = null;

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(d){ if (!d) return ''; const dt = new Date(d+'T00:00:00'); if (isNaN(dt)) return d; return dt.toLocaleDateString('ka-GE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  function weekdayName(dateStr){ if (!dateStr) return ''; const days=['კვირა','ორშ','სამ','ოთხ','ხუთ','პარ','შაბ']; const dt=new Date(dateStr+'T00:00:00'); if (isNaN(dt)) return ''; return days[dt.getDay()]; }
  function fmtR(v){ if (v===null||v===undefined||isNaN(v)) return '-'; return (v>0?'+':'')+v.toFixed(2)+'R'; }
  function fmtUsd(v){ if (v===null||v===undefined||isNaN(v)) return '-'; const s = Math.abs(v).toLocaleString(undefined,{maximumFractionDigits:2}); return (v>=0?'+$':'-$')+s; }
  function sleepHoursBetween(bed,wake){ if (!bed||!wake) return null; const [bh,bm]=bed.split(':').map(Number); const [wh,wm]=wake.split(':').map(Number); if (isNaN(bh)||isNaN(wh)) return null; let bedMin=bh*60+bm, wakeMin=wh*60+wm; let diff=wakeMin-bedMin; if (diff<=0) diff+=24*60; return +(diff/60).toFixed(2); }
  function hasUsd(t){ return t.pnlUsd !== undefined && t.pnlUsd !== null && t.pnlUsd !== ''; }

  function animateValue(el, to, opts){
    opts = opts || {};
    const dur = opts.duration || 700;
    const fmt = opts.fmt || (v => Math.round(v).toString());
    const from = 0;
    const start = performance.now();
    function step(now){
      const p = Math.min(1, (now-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = fmt(from + (to-from)*eased);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  const root = document.getElementById('tj-root');
  const lightbox = document.getElementById('tj-lightbox');
  const lightboxContent = document.getElementById('tj-lightbox-content');
  document.getElementById('tj-lightbox-close').onclick = closeLightbox;
  lightbox.addEventListener('click', (e)=>{ if (e.target===lightbox) closeLightbox(); });
  window.addEventListener('keydown', (e)=>{ if (e.key==='Escape'){ closeLightbox(); closeDrawer(); } });
  function openImageModal(dataUrl){ lightboxContent.innerHTML = `<img src="${dataUrl}" style="max-width:100%; max-height:78vh; border-radius:8px;"/>`; lightbox.style.display='flex'; }
  function closeLightbox(){ lightbox.style.display='none'; lightboxContent.innerHTML=''; }

  function fileToCompressedBase64(file, maxW){
    maxW = maxW || 1280;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxW){ h = Math.round(h*(maxW/w)); w = maxW; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg',0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function ensureChartJs(cb){
    if (window.Chart) { cb(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js';
    s.onload = cb;
    document.body.appendChild(s);
  }

  // ================= AUTH =================
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const authWrap = document.getElementById('tj-auth');
  const authTabsEl = document.getElementById('tj-auth-tabs');
  const authBodyEl = document.getElementById('tj-auth-body');
  const shellEl = document.getElementById('tj-shell');
  const userEmailEl = document.getElementById('tj-user-email');

  function authBtnStyle(active){ return `padding:6px 16px; border-radius:8px; font-size:13px; cursor:pointer; border:0.5px solid ${active?'var(--tj-accent)':'var(--tj-border)'}; background:${active?'rgba(230,185,77,0.15)':'transparent'}; color:${active?'var(--tj-text)':'var(--tj-text2)'};`; }
  function authMsgBox(){ return `<div id="tj-auth-msg" style="font-size:12px; margin-top:10px; min-height:16px; text-align:center;"></div>`; }
  function fieldLabel(txt){ return `<div style="font-size:11px; color:var(--tj-text2); margin-bottom:5px;">${txt}</div>`; }

  function renderAuthTabs(){
    authTabsEl.innerHTML = `<button data-t="login" style="${authBtnStyle(authTab==='login')}">შესვლა</button><button data-t="register" style="${authBtnStyle(authTab==='register')}">რეგისტრაცია</button>`;
    authTabsEl.querySelectorAll('button').forEach(b=>{ b.onclick = () => { authTab = b.dataset.t; renderAuthTabs(); renderAuthBody(); }; });
  }
  function renderAuthBody(){ if (authTab==='login') renderLoginForm(); else renderRegisterForm(); }
  function describeError(err){ if (!err) return 'უცნობი შეცდომა'; if (typeof err==='string') return err; if (err.message) return err.message; return 'უცნობი შეცდომა.'; }

  function renderLoginForm(){
    authBodyEl.innerHTML = `<form id="tj-login-form">
      <div style="margin-bottom:12px;">${fieldLabel('ელფოსტა')}<input type="email" name="email" required/></div>
      <div style="margin-bottom:6px;">${fieldLabel('პაროლი')}<input type="password" name="password" required/></div>
      <button type="submit" class="tj-btn primary" style="width:100%; margin-top:14px; padding:10px;">შესვლა</button>
      ${authMsgBox()}</form>`;
    const form = authBodyEl.querySelector('#tj-login-form');
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      const msg = form.querySelector('#tj-auth-msg');
      msg.style.color='var(--tj-text2)'; msg.textContent='შესვლა მიმდინარეობს…';
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') });
        if (error){ msg.style.color='var(--tj-red)'; msg.textContent = error.message==='Invalid login credentials' ? 'ელფოსტა ან პაროლი არასწორია.' : describeError(error); return; }
        await onAuthSuccess(data.user);
      } catch(ex){ msg.style.color='var(--tj-red)'; msg.textContent='კავშირის შეცდომა.'; }
    });
  }
  function renderRegisterForm(){
    authBodyEl.innerHTML = `<form id="tj-register-form">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
        <div>${fieldLabel('სახელი')}<input type="text" name="firstName" required/></div>
        <div>${fieldLabel('გვარი')}<input type="text" name="lastName" required/></div>
      </div>
      <div style="margin-bottom:12px;">${fieldLabel('ელფოსტა')}<input type="email" name="email" required/></div>
      <div style="margin-bottom:6px;">${fieldLabel('პაროლი (მინ. 6 სიმბოლო)')}<input type="password" name="password" minlength="6" required/></div>
      <button type="submit" class="tj-btn primary" style="width:100%; margin-top:14px; padding:10px;">რეგისტრაცია</button>
      ${authMsgBox()}</form>`;
    const form = authBodyEl.querySelector('#tj-register-form');
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      const msg = form.querySelector('#tj-auth-msg');
      msg.style.color='var(--tj-text2)'; msg.textContent='იგზავნება…';
      const email = fd.get('email');
      try {
        const { data, error } = await supabase.auth.signUp({ email, password: fd.get('password'), options:{ data:{ first_name:fd.get('firstName'), last_name:fd.get('lastName') } } });
        if (error){ msg.style.color='var(--tj-red)'; msg.textContent=describeError(error); return; }
        renderVerifyForm(email);
      } catch(ex){ msg.style.color='var(--tj-red)'; msg.textContent='კავშირის შეცდომა.'; }
    });
  }
  function renderVerifyForm(email){
    authBodyEl.innerHTML = `<div style="text-align:center; font-size:13px; color:var(--tj-text2); margin-bottom:16px;">კოდი გამოგზავნილია მისამართზე<br/><span style="color:var(--tj-text); font-weight:500;">${escapeHtml(email)}</span></div>
      <form id="tj-verify-form">
        <div style="margin-bottom:12px;">${fieldLabel('დაადასტურეთ კოდი')}<input type="text" name="token" inputmode="numeric" maxlength="8" required style="text-align:center; letter-spacing:4px; font-size:18px;" placeholder="00000000"/></div>
        <button type="submit" class="tj-btn primary" style="width:100%; margin-top:6px; padding:10px;">დადასტურება</button>
        ${authMsgBox()}
      </form>
      <button id="tj-resend-btn" type="button" class="tj-btn" style="margin-top:10px; width:100%; padding:8px;">კოდის ხელახლა გაგზავნა</button>`;
    const form = authBodyEl.querySelector('#tj-verify-form');
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      const msg = form.querySelector('#tj-auth-msg');
      msg.style.color='var(--tj-text2)'; msg.textContent='მოწმდება…';
      try {
        const { data, error } = await supabase.auth.verifyOtp({ email, token: fd.get('token'), type:'signup' });
        if (error){ msg.style.color='var(--tj-red)'; msg.textContent='კოდი არასწორია ან ვადა გაუვიდა.'; return; }
        await onAuthSuccess(data.user);
      } catch(ex){ msg.style.color='var(--tj-red)'; msg.textContent='კავშირის შეცდომა.'; }
    });
    authBodyEl.querySelector('#tj-resend-btn').onclick = async () => {
      const btn = authBodyEl.querySelector('#tj-resend-btn');
      btn.disabled = true; btn.textContent = 'იგზავნება…';
      try { await supabase.auth.resend({ type:'signup', email }); btn.textContent='კოდი ხელახლა გაიგზავნა ✓'; }
      catch(ex){ btn.textContent='ვერ გაიგზავნა - სცადეთ თავიდან'; }
      setTimeout(()=>{ btn.disabled=false; btn.textContent='კოდის ხელახლა გაგზავნა'; }, 5000);
    };
  }
  async function onAuthSuccess(user){
    currentUser = user;
    authWrap.style.display = 'none';
    shellEl.style.display = 'flex';
    userEmailEl.textContent = user.email;
    await startApp();
  }
  document.getElementById('tj-logout-btn').addEventListener('click', async ()=>{
    await supabase.auth.signOut();
    currentUser = null; trades = []; dailyReports = [];
    shellEl.style.display = 'none'; authWrap.style.display = 'block';
    authTab = 'login'; renderAuthTabs(); renderAuthBody();
  });

  // ================= SIDEBAR / NAV =================
  const NAV_ITEMS = [
    ['dashboard','მთავარი','◆'],
    ['new','ახალი ტრეიდი','+'],
    ['trades','ტრეიდები','▤'],
    ['drc','დღის რეპორტი','☾'],
    ['analytics','ანალიტიკა','▲'],
    ['ai','AI ანალიზი','✦'],
    ['accounts','ანგარიშები','◐'],
    ['settings','პარამეტრები','⚙'],
    ['guide','ინსტრუქცია','?']
  ];
  const PAGE_TITLES = Object.fromEntries(NAV_ITEMS.map(([id,label])=>[id,label]));

  let navIndicatorEl = null;
  function renderNav(){
    const navEl = document.getElementById('tj-nav');
    navEl.innerHTML = NAV_ITEMS.map(([id,label,icon]) => `
      <button type="button" class="tj-nav-item ${page===id?'active':''}" data-page="${id}">
        <span class="tj-nav-icon">${icon}</span><span class="tj-nav-label">${label}</span>
      </button>`).join('');
    if (!navIndicatorEl){
      navIndicatorEl = document.createElement('div');
      navIndicatorEl.id = 'tj-nav-indicator';
    }
    navEl.appendChild(navIndicatorEl);
    navEl.querySelectorAll('[data-page]').forEach(b=>{
      b.onclick = () => { document.getElementById('tj-sidebar').classList.remove('mobile-open'); document.getElementById('tj-scrim').classList.remove('show'); goToPage(b.dataset.page); };
    });
    document.getElementById('tj-topbar-title').textContent = PAGE_TITLES[page] || '';
    requestAnimationFrame(moveNavIndicator);
  }
  function moveNavIndicator(){
    const activeBtn = document.querySelector('.tj-nav-item.active');
    if (!activeBtn || !navIndicatorEl) return;
    navIndicatorEl.style.transform = `translateY(${activeBtn.offsetTop}px)`;
    navIndicatorEl.style.height = activeBtn.offsetHeight + 'px';
  }
  // switches the active sidebar page with a short out/in transition, so navigation
  // feels like moving deeper into one app rather than an instant content swap
  function goToPage(newId){
    if (newId === page){ return; }
    closeDrawer();
    bodyEl.classList.remove('tj-fadein');
    bodyEl.classList.add('tj-page-exit');
    setTimeout(() => {
      page = newId;
      bodyEl.classList.remove('tj-page-exit');
      renderNav();
      renderPage();
    }, 150);
  }
  document.getElementById('tj-sidebar-toggle').onclick = () => {
    sidebarCollapsed = !sidebarCollapsed;
    document.getElementById('tj-sidebar').classList.toggle('collapsed', sidebarCollapsed);
  };
  document.getElementById('tj-mobile-burger').onclick = () => {
    document.getElementById('tj-sidebar').classList.add('mobile-open');
    document.getElementById('tj-scrim').classList.add('show');
  };
  document.getElementById('tj-scrim').onclick = () => {
    document.getElementById('tj-sidebar').classList.remove('mobile-open');
    document.getElementById('tj-scrim').classList.remove('show');
  };

  const bodyEl = document.getElementById('tj-body');

  // ================= DRAWER =================
  const drawerEl = document.getElementById('tj-drawer');
  const drawerScrim = document.getElementById('tj-drawer-scrim');
  drawerScrim.onclick = closeDrawer;
  function openDrawer(html){
    drawerEl.innerHTML = html;
    drawerScrim.classList.add('show');
    document.getElementById('tj-main').classList.add('tj-dimmed');
    requestAnimationFrame(()=>drawerEl.classList.add('show'));
  }
  function closeDrawer(){
    drawerEl.classList.remove('show');
    drawerScrim.classList.remove('show');
    document.getElementById('tj-main').classList.remove('tj-dimmed');
    document.querySelectorAll('.tj-row-selected').forEach(r=>r.classList.remove('tj-row-selected'));
  }

  // ================= TAG PICKER =================
  function tagPickerHtml(kind, selected, extraClass){
    const list = settings[kind] || [];
    const chips = list.map(t => `<button type="button" class="tj-chip ${extraClass||''} ${selected.includes(t)?'sel':''}" data-tagpick="${kind}" data-val="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('');
    return `<div class="tj-tagpicker" data-kind="${kind}" style="display:flex; flex-wrap:wrap; gap:7px; align-items:center;">
      ${chips}
      <input type="text" data-tagnew="${kind}" placeholder="+ ახალი..." style="width:120px; padding:6px 9px; border-radius:999px; border:0.5px dashed var(--tj-border); background:transparent; color:var(--tj-text); font-size:12px; min-height:auto;"/>
    </div>`;
  }
  function wireTagPicker(container, selectedArr, onChange){
    container.querySelectorAll('.tj-tagpicker').forEach(wrap => {
      const kind = wrap.dataset.kind;
      wrap.querySelectorAll('[data-tagpick]').forEach(chip => {
        chip.onclick = () => {
          const val = chip.dataset.val;
          const idx = selectedArr.indexOf(val);
          if (idx===-1) selectedArr.push(val); else selectedArr.splice(idx,1);
          chip.classList.toggle('sel');
          if (onChange) onChange();
        };
      });
      const input = wrap.querySelector(`[data-tagnew="${kind}"]`);
      if (input){
        input.addEventListener('keydown', async (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const val = input.value.trim();
          if (!val) return;
          if (!settings[kind].includes(val)){ settings[kind].push(val); await saveSettings(); }
          if (!selectedArr.includes(val)) selectedArr.push(val);
          input.value = '';
          const newChip = document.createElement('button');
          newChip.type = 'button';
          newChip.className = 'tj-chip sel' + (kind==='vetoes' ? ' veto' : '');
          newChip.dataset.tagpick = kind; newChip.dataset.val = val;
          newChip.textContent = val;
          wrap.insertBefore(newChip, input);
          newChip.onclick = () => {
            const i = selectedArr.indexOf(val);
            if (i===-1) selectedArr.push(val); else selectedArr.splice(i,1);
            newChip.classList.toggle('sel');
            if (onChange) onChange();
          };
          if (onChange) onChange();
        });
      }
    });
  }

  function metricCard(label, value, sub, color, delayIdx){
    const delay = (delayIdx||0) * 45;
    return `<div class="tj-panelcard tj-kpi tj-rise" style="--tj-delay:${delay}ms;">
      <div class="tj-kpi-label">${label}</div>
      <div class="tj-kpi-value" style="color:${color||'var(--tj-text)'};">${value}</div>
      ${sub ? `<div class="tj-kpi-sub">${sub}</div>` : ''}
    </div>`;
  }
  function statChip(label, value, color){
    return `<div style="background:var(--tj-panel2); border-radius:8px; padding:8px 12px; font-size:12px; display:flex; gap:8px; align-items:center;">
      <span style="color:var(--tj-text3);">${label}:</span><span class="tj-mono" style="color:${color||'var(--tj-text)'}; font-weight:600;">${value}</span>
    </div>`;
  }
  function sampleBadge(n){
    const color = n>=30 ? 'var(--tj-green)' : 'var(--tj-amber)';
    const label = n>=30 ? 'საკმარისი მონაცემი' : 'მცირე მონაცემი';
    return `<span class="tj-badge" style="border:0.5px solid ${color}; color:${color};">${label} (n=${n})</span>`;
  }
  function ring(pct, size, color){
    size = size || 64;
    const r = size/2 - 6, c = 2*Math.PI*r;
    const off = c * (1 - Math.max(0,Math.min(100,pct))/100);
    return `<svg class="tj-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="tj-ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="6"/>
      <circle class="tj-ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="6" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-final-offset="${off}" style="stroke:${color||'var(--tj-accent)'};"/>
    </svg>`;
  }
  // rings fill from 0 -> final value whenever they enter the DOM, anywhere in the app
  const ringObserver = new MutationObserver((mutations) => {
    mutations.forEach(m => {
      m.addedNodes.forEach(node => {
        if (node.nodeType !== 1) return;
        const targets = [];
        if (node.matches && node.matches('.tj-ring-fg[data-final-offset]')) targets.push(node);
        if (node.querySelectorAll) targets.push(...node.querySelectorAll('.tj-ring-fg[data-final-offset]'));
        targets.forEach(el => {
          requestAnimationFrame(() => requestAnimationFrame(() => { el.style.strokeDashoffset = el.dataset.finalOffset; }));
        });
      });
    });
  });
  ringObserver.observe(root, { childList:true, subtree:true });
  function tradeContextLabel(t){
    if (t.tradeContext==='with_trend') return 'ტრენდული ვაჭრობაა';
    if (t.tradeContext==='counter_trend') return 'ტრენდსაწინააღმდეგო';
    if (t.tradeContext==='range_reversal') return 'რეინჯის ექსტრემიდან მობრუნება';
    if (t.tradeContext==='other') return t.tradeContextOther || 'სხვა';
    return '';
  }
  function outcomeColor(o){ return o==='win' ? 'var(--tj-green)' : o==='loss' ? 'var(--tj-red)' : 'var(--tj-text2)'; }
  const SESSIONS = [['asia','აზია'],['london','ლონდონი'],['ny','ნიუ-იორკი'],['other','სხვა']];
  function sessionLabel(v){ const f = SESSIONS.find(s=>s[0]===v); return f ? f[1] : ''; }

  // ================= NEW TRADE =================
  let draftTrade = null;
  function defaultDraftTrade(prefill){
    return Object.assign({
      date: todayStr(), time:'', instrument:'', direction:'long', accountId:'', session:'',
      setups:[], vetoes:[], marketTags:[], srTags:[], marketNote:'',
      tradeContext:'', tradeContextOther:'',
      entryPrice:'', exitPrice:'', stopPrice:'', targetPrice:'',
      riskPct:'', resultR:'', resultPoints:'', pnlUsd:'', outcome:'',
      planAdherence:'yes', confidence:'', discipline:'', execution:'',
      screenshots:{before:null, entry:null, after:null}, notes:''
    }, prefill || {});
  }
  function historicalStatFor(arrKey, values){
    if (!values || !values.length) return null;
    const matches = trades.filter(t => (t[arrKey]||[]).some(v => values.includes(v)) && t.outcome);
    if (matches.length < 3) return null;
    const wins = matches.filter(t=>t.outcome==='win').length;
    const avgR = matches.reduce((s,t)=>s+num(t.resultR),0)/matches.length;
    return { n: matches.length, winRate: Math.round(100*wins/matches.length), avgR };
  }

  // ================= FILTERS =================
  function getFilteredTrades(){
    return trades.filter(t=>{
      if (filters.instrument.length && !filters.instrument.includes(t.instrument)) return false;
      if (filters.direction.length && !filters.direction.includes(t.direction)) return false;
      if (filters.outcome.length && !filters.outcome.includes(t.outcome)) return false;
      if (filters.setup.length && !(t.setups||[]).some(s=>filters.setup.includes(s))) return false;
      if (filters.veto.length && !(t.vetoes||[]).some(v=>filters.veto.includes(v))) return false;
      if (filters.accountId.length && !filters.accountId.includes(t.accountId||'')) return false;
      if (filters.adherence.length && !filters.adherence.includes(t.planAdherence||'yes')) return false;
      if (filters.session.length && !filters.session.includes(t.session||'')) return false;
      if (filters.dateFrom && t.date < filters.dateFrom) return false;
      if (filters.dateTo && t.date > filters.dateTo) return false;
      return true;
    }).sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.time||'').localeCompare(a.time||''));
  }
  function filterDefs(){
    const instruments = Array.from(new Set(trades.map(t=>t.instrument).filter(Boolean)));
    return [
      { key:'instrument', label:'ინსტრუმენტი', options: instruments.map(v=>({value:v,label:v})) },
      { key:'direction', label:'მიმართულება', options: [{value:'long',label:'Long'},{value:'short',label:'Short'}] },
      { key:'outcome', label:'შედეგი', options: [{value:'win',label:'Win'},{value:'loss',label:'Loss'},{value:'be',label:'Breakeven'}] },
      { key:'setup', label:'Setup', options: settings.setups.map(v=>({value:v,label:v})) },
      { key:'veto', label:'Veto', options: settings.vetoes.map(v=>({value:v,label:v})) },
      { key:'session', label:'სესია', options: SESSIONS.map(([v,l])=>({value:v,label:l})) },
      { key:'accountId', label:'ანგარიში', options: accounts.map(a=>({value:a.id,label:a.label})) },
      { key:'adherence', label:'გეგმის დაცვა', options: [{value:'yes',label:'დიახ'},{value:'no',label:'არა'}] },
    ];
  }
  function filtersActive(){ return filterDefs().some(d => filters[d.key].length > 0) || filters.dateFrom || filters.dateTo; }
  function multiFilterControl(def){
    const selected = filters[def.key];
    const summaryLabel = selected.length ? `${def.label} (${selected.length})` : def.label;
    return `<details class="tj-mfilter" data-key="${def.key}" style="position:relative;" ${openFilterKey===def.key?'open':''}>
      <summary class="tj-select-sm" style="list-style:none; cursor:pointer; border-radius:7px; border:0.5px solid ${selected.length?'var(--tj-accent)':'var(--tj-border)'}; background:var(--tj-panel2); color:${selected.length?'var(--tj-text)':'var(--tj-text2)'}; user-select:none; display:inline-block;">${summaryLabel} ▾</summary>
      <div class="tj-dropdown-pop" style="position:absolute; z-index:20; top:calc(100% + 4px); left:0; background:var(--tj-panel2); border:0.5px solid var(--tj-border); border-radius:8px; padding:8px; min-width:190px; max-height:220px; overflow-y:auto; box-shadow:0 6px 20px rgba(0,0,0,0.45);">
        ${def.options.length ? def.options.map(o=>`<label style="display:flex; align-items:center; gap:7px; font-size:12px; padding:4px 3px; cursor:pointer; color:var(--tj-text); white-space:nowrap;"><input type="checkbox" class="tj-mf-box" data-key="${def.key}" value="${escapeHtml(o.value)}" ${selected.includes(o.value)?'checked':''} style="accent-color:var(--tj-accent);"/> ${escapeHtml(o.label)}</label>`).join('') : `<div style="font-size:11px; color:var(--tj-text3); padding:4px;">არ არის ვარიანტი</div>`}
      </div>
    </details>`;
  }
  function renderFilterBar(){
    return `<div id="tj-filterbar" style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; padding:12px; background:var(--tj-panel); border-radius:10px;">
      <span style="font-size:11px; color:var(--tj-text3); margin-right:2px;">ფილტრი:</span>
      ${filterDefs().map(multiFilterControl).join('')}
      <input type="date" data-f="dateFrom" class="tj-select-sm" value="${filters.dateFrom}" title="თარიღიდან" style="min-height:auto;"/>
      <input type="date" data-f="dateTo" class="tj-select-sm" value="${filters.dateTo}" title="თარიღამდე" style="min-height:auto;"/>
      ${filtersActive() ? `<button id="tj-clear-filters" type="button" class="tj-btn" style="border-color:var(--tj-amber); color:var(--tj-text);">გასუფთავება</button>` : ''}
      <span style="font-size:11px; color:var(--tj-text3); margin-left:auto;">${getFilteredTrades().length} / ${trades.length} ტრეიდი</span>
    </div>`;
  }
  function wireFilterBar(onChange){
    const bar = bodyEl.querySelector('#tj-filterbar');
    if (!bar) return;
    bar.querySelectorAll('.tj-mf-box').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const key = cb.dataset.key; const arr = filters[key]; const idx = arr.indexOf(cb.value);
        if (cb.checked && idx===-1) arr.push(cb.value);
        if (!cb.checked && idx!==-1) arr.splice(idx,1);
        openFilterKey = key; onChange();
      });
    });
    bar.querySelectorAll('[data-f]').forEach(el=>{ el.addEventListener('change', ()=>{ filters[el.dataset.f] = el.value; onChange(); }); });
    const clearBtn = bodyEl.querySelector('#tj-clear-filters');
    if (clearBtn) clearBtn.onclick = () => { filters = { instrument:[], direction:[], outcome:[], setup:[], veto:[], accountId:[], adherence:[], session:[], dateFrom:'', dateTo:'' }; openFilterKey=null; onChange(); };
  }

  // ================= TRADES TABLE + DRAWER =================
  function renderTrades(){
    const filtered = getFilteredTrades();
    bodyEl.innerHTML = renderFilterBar() + (filtered.length ? `<div class="tj-panelcard tj-table-wrap"><table class="tj-table" id="tj-trades-table">
      <thead><tr><th>თარიღი</th><th>დრო</th><th>ინსტრ.</th><th>მიმართ.</th><th>Setup</th><th>სესია</th><th>რისკი</th><th>R</th><th>Points</th><th>P&L $</th><th>შედეგი</th></tr></thead>
      <tbody></tbody></table></div>` : `<div style="padding:40px 0; text-align:center; color:var(--tj-text2); font-size:13px;">${trades.length ? 'ფილტრით ვერაფერი მოიძებნა.' : 'ჯერ არცერთი ტრეიდი არ დამატებულა. დაამატეთ "ახალი ტრეიდი" გვერდიდან.'}</div>`);
    wireFilterBar(renderTrades);
    const tbody = bodyEl.querySelector('#tj-trades-table tbody');
    if (!tbody) return;
    tbody.innerHTML = filtered.map(t => `
      <tr data-open="${t.id}">
        <td>${fmtDate(t.date)}</td>
        <td class="tj-mono">${t.time||'-'}</td>
        <td style="font-weight:600;">${escapeHtml(t.instrument)}</td>
        <td>${t.direction==='long'?'Long':'Short'}</td>
        <td>${(t.setups&&t.setups[0]) ? escapeHtml(t.setups[0])+(t.setups.length>1?` +${t.setups.length-1}`:'') : '-'}</td>
        <td>${sessionLabel(t.session)||'-'}</td>
        <td class="tj-mono">${t.riskPct?t.riskPct+'%':'-'}</td>
        <td class="tj-mono" style="color:${outcomeColor(t.outcome)};">${t.outcome?fmtR(num(t.resultR)):'-'}</td>
        <td class="tj-mono">${t.resultPoints?((num(t.resultPoints)>0?'+':'')+t.resultPoints):'-'}</td>
        <td class="tj-mono" style="color:${hasUsd(t)?(num(t.pnlUsd)>=0?'var(--tj-green)':'var(--tj-red)'):'var(--tj-text3)'};">${hasUsd(t)?fmtUsd(num(t.pnlUsd)):'-'}</td>
        <td><span class="tj-badge" style="background:${t.outcome==='win'?'rgba(95,168,118,0.15)':t.outcome==='loss'?'rgba(193,93,76,0.15)':'rgba(255,255,255,0.06)'}; color:${outcomeColor(t.outcome)};">${t.outcome?t.outcome.toUpperCase():'-'}</span></td>
      </tr>`).join('');
    tbody.querySelectorAll('[data-open]').forEach(row => {
      row.onclick = () => {
        tbody.querySelectorAll('tr').forEach(r=>r.classList.remove('tj-row-selected'));
        row.classList.add('tj-row-selected');
        openTradeDrawer(row.dataset.open);
      };
    });
  }

  function openTradeDrawer(id){
    const t = trades.find(x=>x.id===id);
    if (!t) return;
    const acc = accounts.find(a=>a.id===t.accountId);
    const shots = t.screenshots || {};
    openDrawer(`
      <button class="tj-drawer-close" id="tj-drawer-close-btn">✕</button>
      <div class="tj-serif" style="font-size:18px; font-weight:600; margin-bottom:2px;">${escapeHtml(t.instrument)} · ${t.direction==='long'?'Long':'Short'}</div>
      <div style="font-size:12px; color:var(--tj-text3); margin-bottom:16px;">${fmtDate(t.date)} ${t.time||''}</div>
      <div style="display:flex; gap:20px; margin-bottom:18px;">
        <div><div style="font-size:11px; color:var(--tj-text3);">შედეგი</div><div class="tj-mono" style="font-size:20px; font-weight:600; color:${outcomeColor(t.outcome)};">${t.outcome?fmtR(num(t.resultR)):'-'}</div></div>
        ${hasUsd(t) ? `<div><div style="font-size:11px; color:var(--tj-text3);">P&L</div><div class="tj-mono" style="font-size:20px; font-weight:600; color:${num(t.pnlUsd)>=0?'var(--tj-green)':'var(--tj-red)'};">${fmtUsd(num(t.pnlUsd))}</div></div>` : ''}
      </div>
      <div class="tj-drawer-row"><span>Entry</span><span>${t.entryPrice||'-'}</span></div>
      <div class="tj-drawer-row"><span>Exit</span><span>${t.exitPrice||'-'}</span></div>
      <div class="tj-drawer-row"><span>Stop Loss</span><span>${t.stopPrice||'-'}</span></div>
      <div class="tj-drawer-row"><span>Take Profit</span><span>${t.targetPrice||'-'}</span></div>
      <div class="tj-drawer-row"><span>რისკი</span><span>${t.riskPct?t.riskPct+'%':'-'}</span></div>
      <div class="tj-drawer-row"><span>პოინტები</span><span>${t.resultPoints||'-'}</span></div>
      <div class="tj-drawer-row"><span>სესია</span><span>${sessionLabel(t.session)||'-'}</span></div>
      <div class="tj-drawer-row"><span>ანგარიში</span><span>${acc?escapeHtml(acc.label):'-'}</span></div>
      <div class="tj-drawer-row"><span>გეგმის დაცვა</span><span style="color:${t.planAdherence==='no'?'var(--tj-amber)':'var(--tj-text)'};">${t.planAdherence==='no'?'არა':'დიახ'}</span></div>
      ${t.tradeContext ? `<div class="tj-drawer-row"><span>თრეიდის ტიპი</span><span>${escapeHtml(tradeContextLabel(t))}</span></div>` : ''}
      ${(t.confidence||t.discipline||t.execution) ? `<div style="margin-top:16px;"><div style="font-size:12px; color:var(--tj-text3); margin-bottom:8px;">ფსიქოლოგია</div>
        <div style="display:flex; gap:16px;">
          ${t.confidence?`<div style="text-align:center;">${ring(num(t.confidence)*10,52)}<div style="font-size:10.5px; color:var(--tj-text3); margin-top:4px;">Confidence</div></div>`:''}
          ${t.discipline?`<div style="text-align:center;">${ring(num(t.discipline)*10,52)}<div style="font-size:10.5px; color:var(--tj-text3); margin-top:4px;">Discipline</div></div>`:''}
          ${t.execution?`<div style="text-align:center;">${ring(num(t.execution)*10,52)}<div style="font-size:10.5px; color:var(--tj-text3); margin-top:4px;">Execution</div></div>`:''}
        </div></div>` : ''}
      ${(t.setups&&t.setups.length) ? `<div style="margin-top:16px; display:flex; flex-wrap:wrap; gap:6px;">${t.setups.map(s=>`<span class="tj-badge" style="background:rgba(169,133,60,0.16); color:var(--tj-accent-light);">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
      ${(t.vetoes&&t.vetoes.length) ? `<div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;">${t.vetoes.map(v=>`<span class="tj-badge" style="background:rgba(193,93,76,0.14); color:var(--tj-red);">${escapeHtml(v)}</span>`).join('')}</div>` : ''}
      ${t.marketNote ? `<div style="margin-top:14px; font-size:12.5px; color:var(--tj-text2);"><strong style="color:var(--tj-text3);">ბაზარი:</strong> ${escapeHtml(t.marketNote)}</div>` : ''}
      ${t.notes ? `<div style="margin-top:10px; font-size:12.5px; color:var(--tj-text2);">${escapeHtml(t.notes)}</div>` : ''}
      ${(shots.before||shots.entry||shots.after) ? `<div style="margin-top:16px;"><div style="font-size:12px; color:var(--tj-text3); margin-bottom:8px;">სქრინშოტები</div><div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${['before','entry','after'].map(k=>shots[k]?`<img src="${shots[k]}" data-shotview="${k}" style="width:100px; height:70px; object-fit:cover; border-radius:6px; border:0.5px solid var(--tj-border); cursor:pointer;"/>`:'').join('')}
      </div></div>` : ''}
      <div style="display:flex; gap:8px; margin-top:24px;">
        <button id="tj-drawer-edit" class="tj-btn" type="button">რედაქტირება</button>
        <button id="tj-drawer-del" class="tj-btn" type="button" style="border-color:var(--tj-red); color:var(--tj-red);">წაშლა</button>
      </div>
    `);
    drawerEl.querySelector('#tj-drawer-close-btn').onclick = closeDrawer;
    drawerEl.querySelectorAll('[data-shotview]').forEach(img=>{ img.onclick = () => openImageModal(img.getAttribute('src')); });
    drawerEl.querySelector('#tj-drawer-edit').onclick = () => {
      closeDrawer();
      editingTradeId = t.id;
      draftTrade = defaultDraftTrade(Object.assign({}, t, { screenshots: Object.assign({before:null,entry:null,after:null}, t.screenshots||{}) }));
      goToPage('new');
    };
    drawerEl.querySelector('#tj-drawer-del').onclick = async () => {
      if (!confirm('წავშალო ეს ტრეიდი?')) return;
      await deleteTradeRemote(t.id);
      closeDrawer();
      showToast('ტრეიდი წაიშალა', 'ok');
      renderTrades();
    };
  }

  // ================= DAILY REPORT CARD =================
  function getReport(date){ return dailyReports.find(r=>r.date===date) || null; }
  function defaultReport(date){ return { date, bedtime:'', wakeTime:'', processGoal:'', goalResult:'', energy:'', stress:'', tradedToday:'', easiestMoney:'', whatWorked:'', toImprove:'', tomorrowFocus:'' }; }
  function rateChips(name, value, max){
    let html = '<div style="display:flex; gap:6px;">';
    for (let i=1;i<=max;i++) html += `<button type="button" class="tj-rate ${Number(value)===i?'sel':''}" data-rate="${name}" data-val="${i}">${i}</button>`;
    return html + '</div>';
  }
  function renderDRC(){
    let rep = getReport(drcDate) || defaultReport(drcDate);
    const sleepHours = sleepHoursBetween(rep.bedtime, rep.wakeTime);
    const recentDays = Array.from({length:14}, (_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(13-i)); return d.toISOString().slice(0,10); });

    bodyEl.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:6px;">
        <div class="tj-serif" style="font-size:17px; font-weight:600;">დღის რეპორტი</div>
        <input type="date" id="tj-drc-date" value="${drcDate}" class="tj-select-sm" style="min-height:auto; width:auto;"/>
      </div>
      <div style="font-size:12.5px; color:var(--tj-text2); margin-bottom:18px; line-height:1.6;">ავსებთ ყოველდღე - ტრეიდის გარეშეც. მიზანი არ არის მოგება, არამედ პროცესის დისციპლინა.</div>

      <div style="display:flex; gap:4px; margin-bottom:24px; overflow-x:auto; padding-bottom:4px;">
        ${recentDays.map(dt=>{ const r=getReport(dt); let color='var(--tj-border)'; if (r){ color = r.goalResult==='met'?'var(--tj-green)':r.goalResult==='partial'?'var(--tj-amber)':r.goalResult==='missed'?'var(--tj-red)':'var(--tj-text3)'; } return `<div class="tj-drc-strip-day" title="${dt}" style="background:${color}; opacity:${dt===drcDate?1:0.55}; ${dt===drcDate?'box-shadow:0 0 0 2px var(--tj-accent);':''}"></div>`; }).join('')}
      </div>

      <form id="tj-drc-form">
        <div class="tj-panelcard" style="padding:16px 18px; margin-bottom:16px;">
          <div style="font-size:13px; font-weight:600; margin-bottom:12px;">ძილი</div>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:10px;">
            <div>${fieldLabel('დაძინების დრო')}<input type="time" name="bedtime" value="${rep.bedtime}"/></div>
            <div>${fieldLabel('გაღვიძების დრო')}<input type="time" name="wakeTime" value="${rep.wakeTime}"/></div>
            <div>${fieldLabel('ძილის ხანგრძლივობა')}<div style="padding:8px 0; font-size:15px;" class="tj-mono">${sleepHours!==null?sleepHours+' სთ':'-'}</div></div>
            <div>${fieldLabel('რეკომენდირებული ხანგრძლივობა')}<div style="padding:8px 0; font-size:15px; color:var(--tj-text2);" class="tj-mono">7-9 სთ</div></div>
          </div>
          <div style="font-size:11.5px; color:var(--tj-text3); background:var(--tj-panel2); border-radius:8px; padding:10px 12px; line-height:1.6;">
            ზოგადი რეკომენდაცია: 7-9 საათი ძილი და მუდმივი დაძინება/გაღვიძების დრო აუმჯობესებს კონცენტრაციასა და დისციპლინას. თქვენი პერსონალური "საუკეთესო ძილის ფანჯარა" გამოითვლება ავტომატურად ანალიტიკის გვერდზე, როგორც კი მინიმუმ 10 სავაჭრო დღის მონაცემი დაგროვდება.
          </div>
        </div>

        <div class="tj-panelcard" style="padding:16px 18px; margin-bottom:16px;">
          <div style="font-size:13px; font-weight:600; margin-bottom:12px;">დღის ერთადერთი ფოკუსი (Process Goal)</div>
          <textarea name="processGoal" rows="2" placeholder="მაგ. „არ გავხსნა 3-ზე მეტი ტრეიდი"" style="resize:vertical; margin-bottom:12px;">${escapeHtml(rep.processGoal)}</textarea>
          ${fieldLabel('შედეგი დღის ბოლოს')}
          <div style="display:flex; gap:8px;">
            <button type="button" data-goal="met" class="tj-btn ${rep.goalResult==='met'?'active':''}" style="${rep.goalResult==='met'?'border-color:var(--tj-green); color:var(--tj-green);':''}">მიღწეული</button>
            <button type="button" data-goal="partial" class="tj-btn ${rep.goalResult==='partial'?'active':''}" style="${rep.goalResult==='partial'?'border-color:var(--tj-amber); color:var(--tj-amber);':''}">ნაწილობრივ</button>
            <button type="button" data-goal="missed" class="tj-btn ${rep.goalResult==='missed'?'active':''}" style="${rep.goalResult==='missed'?'border-color:var(--tj-red); color:var(--tj-red);':''}">ვერ მოხერხდა</button>
          </div>
        </div>

        <div class="tj-panelcard" style="padding:16px 18px; margin-bottom:16px;">
          <div style="font-size:13px; font-weight:600; margin-bottom:12px;">მდგომარეობა დღის დასაწყისში</div>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:16px;">
            <div>${fieldLabel('ენერგია (1-5)')}<div id="tj-energy-wrap">${rateChips('energy', rep.energy, 5)}</div></div>
            <div>${fieldLabel('სტრესი (1-5)')}<div id="tj-stress-wrap">${rateChips('stress', rep.stress, 5)}</div></div>
          </div>
        </div>

        <div class="tj-panelcard" style="padding:16px 18px; margin-bottom:16px;">
          <div style="font-size:13px; font-weight:600; margin-bottom:12px;">დღის შეჯამება</div>
          <div style="margin-bottom:12px;">
            ${fieldLabel('ივაჭრეთ დღეს?')}
            <div style="display:flex; gap:8px;"><button type="button" data-traded="yes" class="tj-btn ${rep.tradedToday==='yes'?'active':''}">დიახ</button><button type="button" data-traded="no" class="tj-btn ${rep.tradedToday==='no'?'active':''}">არა</button></div>
          </div>
          <div style="margin-bottom:12px;">${fieldLabel('რომელი ტრეიდი იყო დღეს ყველაზე მარტივი ფული?')}<textarea name="easiestMoney" rows="2" style="resize:vertical;">${escapeHtml(rep.easiestMoney||'')}</textarea></div>
          <div style="margin-bottom:12px;">${fieldLabel('რა გამოვიდა კარგად?')}<textarea name="whatWorked" rows="2" style="resize:vertical;">${escapeHtml(rep.whatWorked)}</textarea></div>
          <div style="margin-bottom:12px;">${fieldLabel('რა უნდა გამოვასწორო?')}<textarea name="toImprove" rows="2" style="resize:vertical;">${escapeHtml(rep.toImprove)}</textarea></div>
          <div>${fieldLabel('ხვალინდელი ფოკუსი')}<textarea name="tomorrowFocus" rows="2" style="resize:vertical;">${escapeHtml(rep.tomorrowFocus)}</textarea></div>
        </div>

        <button type="submit" class="tj-btn primary" style="padding:10px 22px;">შენახვა</button>
        <div id="tj-drc-msg" style="margin-top:10px; font-size:12px;"></div>
      </form>
    `;

    bodyEl.querySelector('#tj-drc-date').onchange = (e) => { drcDate = e.target.value; renderDRC(); };
    bodyEl.querySelectorAll('[data-goal]').forEach(b=>{ b.onclick = () => { rep.goalResult = b.dataset.goal; syncAndRerender(rep); }; });
    bodyEl.querySelectorAll('[data-traded]').forEach(b=>{ b.onclick = () => { rep.tradedToday = b.dataset.traded; syncAndRerender(rep); }; });
    bodyEl.querySelectorAll('[data-rate]').forEach(b=>{
      b.onclick = () => { rep[b.dataset.rate] = Number(b.dataset.val); const wrap = bodyEl.querySelector(`#tj-${b.dataset.rate}-wrap`); wrap.querySelectorAll('.tj-rate').forEach(r=>r.classList.toggle('sel', r.dataset.val===b.dataset.val)); };
    });
    function syncAndRerender(r){
      const form = bodyEl.querySelector('#tj-drc-form');
      const fd = new FormData(form);
      ['bedtime','wakeTime','processGoal','easiestMoney','whatWorked','toImprove','tomorrowFocus'].forEach(k=>{ r[k] = fd.get(k) || r[k] || ''; });
      dailyReports = dailyReports.filter(x=>x.date!==r.date);
      dailyReports.push(r);
      renderDRC();
    }
    const form = bodyEl.querySelector('#tj-drc-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const msg = form.querySelector('#tj-drc-msg');
      const full = { date: drcDate, bedtime: fd.get('bedtime')||'', wakeTime: fd.get('wakeTime')||'',
        sleepHours: sleepHoursBetween(fd.get('bedtime'), fd.get('wakeTime')),
        processGoal: fd.get('processGoal')||'', goalResult: rep.goalResult||'', energy: rep.energy||'', stress: rep.stress||'',
        tradedToday: rep.tradedToday||'', easiestMoney: fd.get('easiestMoney')||'', whatWorked: fd.get('whatWorked')||'', toImprove: fd.get('toImprove')||'', tomorrowFocus: fd.get('tomorrowFocus')||'' };
      msg.textContent='';
      const submitBtn = form.querySelector('button[type="submit"]');
      setBtnLoading(submitBtn, true, 'ინახება…');
      const ok = await saveDailyReport(full);
      setBtnLoading(submitBtn, false);
      if (ok){ showToast('დღის რეპორტი შენახულია', 'ok'); renderDRC(); }
      else { msg.style.color='var(--tj-red)'; msg.textContent='შენახვა ვერ მოხერხდა.'; }
    });
  }

  // ================= SETTINGS =================
  function settingsListEditor(kind, title, hint){
    return `<div class="tj-panelcard" style="padding:16px 18px; margin-bottom:16px;">
      <div style="font-size:13px; font-weight:600; margin-bottom:4px;">${title}</div>
      <div style="font-size:11.5px; color:var(--tj-text3); margin-bottom:12px;">${hint}</div>
      <div id="tj-settings-${kind}" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
        ${(settings[kind]||[]).map(v=>`<span class="tj-chip sel" style="cursor:default;">${escapeHtml(v)} <span class="tj-chip-del" data-delkind="${kind}" data-delval="${escapeHtml(v)}">✕</span></span>`).join('') || `<span style="font-size:12px; color:var(--tj-text3);">ჯერ არაფერია დამატებული.</span>`}
      </div>
      <div style="display:flex; gap:8px;"><input type="text" data-addkind="${kind}" placeholder="ახალი..." style="max-width:220px;"/><button type="button" data-addbtn="${kind}" class="tj-btn">დამატება</button></div>
    </div>`;
  }
  function renderSettings(){
    bodyEl.innerHTML = `
      <div class="tj-serif" style="font-size:17px; font-weight:600; margin-bottom:4px;">პარამეტრები</div>
      <div style="font-size:12.5px; color:var(--tj-text2); margin-bottom:20px;">განსაზღვრეთ საკუთარი მეთოდოლოგიის ლექსიკონი.</div>
      ${settingsListEditor('setups', 'Setup-ები', 'თქვენი საკუთარი შესვლის პატერნები/სტრატეგიები.')}
      ${settingsListEditor('vetoes', 'Veto პირობები', 'პირობები, რომლებიც არ უნდა შეგხვდეთ, სანამ ტრეიდს გახსნით (ასევე გამოიყენება შეცდომების ანალიზში).')}
      ${settingsListEditor('marketTags', 'ტრენდი / ბაზრის სიტუაციის ტეგები', 'მაგ. „ტრენდული დღე", „ვიწრო რეინჯი" და ა.შ.')}
      ${settingsListEditor('srTags', 'მხარდაჭერა / წინააღმდეგობის დონეები', 'მაგ. „წინა დღის High", „Weekly Open" და ა.შ.')}
      ${settingsListEditor('instruments', 'ინსტრუმენტები', 'ინსტრუმენტები, რომლებზეც ვაჭრობთ.')}
    `;
    ['setups','vetoes','marketTags','srTags','instruments'].forEach(kind=>{
      bodyEl.querySelectorAll(`[data-delkind="${kind}"]`).forEach(x=>{ x.onclick = async () => { settings[kind] = settings[kind].filter(v=>v!==x.dataset.delval); await saveSettings(); renderSettings(); }; });
      const input = bodyEl.querySelector(`[data-addkind="${kind}"]`);
      const btn = bodyEl.querySelector(`[data-addbtn="${kind}"]`);
      async function add(){ const val = input.value.trim(); if (!val || settings[kind].includes(val)) return; settings[kind].push(val); await saveSettings(); renderSettings(); }
      btn.onclick = add;
      input.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); add(); } });
    });
  }

  // ================= ACCOUNTS =================
  function accountStats(accId){
    const accTrades = trades.filter(t=>t.accountId===accId && hasUsd(t)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    let cum = 0, peak = 0, maxDD = 0;
    accTrades.forEach(t=>{ cum += num(t.pnlUsd); if (cum>peak) peak=cum; const dd = cum-peak; if (dd<maxDD) maxDD=dd; });
    const today = todayStr();
    const dailyPnl = trades.filter(t=>t.accountId===accId && t.date===today && hasUsd(t)).reduce((s,t)=>s+num(t.pnlUsd),0);
    return { netPnl: cum, maxDrawdown: maxDD, dailyPnl, tradeCount: accTrades.length };
  }

    const editing = editId ? accounts.find(a=>a.id===editId) : null;
    bodyEl.innerHTML = `

      <form id="tj-account-form" class="tj-panelcard" style="padding:16px; margin-bottom:24px;">
        <div style="font-size:13px; font-weight:500; margin-bottom:12px;">${editing?'ანგარიშის რედაქტირება':'ახალი ანგარიშის დამატება'}</div>
        <div style="display:grid; grid-template-columns:repeat(2, minmax(160px,1fr)); gap:12px; margin-bottom:14px;">
          <div>${fieldLabel('სახელი')}<input type="text" name="label" required placeholder="მაგ. Live #1" value="${editing?escapeHtml(editing.label):''}"/></div>
          <div>${fieldLabel('საწყისი ბალანსი ($)')}<input type="number" step="0.01" name="startBalance" value="${editing?editing.startBalance:''}"/></div>
        </div>
        <button type="submit" class="tj-btn primary">${editing?'შენახვა':'დამატება'}</button>
        ${editing?`<button type="button" id="tj-account-cancel" class="tj-btn" style="margin-left:8px;">გაუქმება</button>`:''}
        <input type="hidden" name="id" value="${editing?editing.id:''}"/>
      </form>
      <div id="tj-accounts-list" style="display:flex; flex-direction:column; gap:12px;"></div>
    `;
    const form = bodyEl.querySelector('#tj-account-form');

    if (cancelBtn) cancelBtn.onclick = () => renderAccounts();
    form.addEventListener('submit', (e) => {

      const fd = new FormData(form);

    listEl.innerHTML = accounts.map(a => {
      const st = accountStats(a.id);
      const balance = num(a.startBalance) + st.netPnl;
      return `<div class="tj-panelcard" style="padding:18px 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
          <div><span style="font-size:15px; font-weight:600;">${escapeHtml(a.label)}</span></div>
          <div style="display:flex; gap:8px;">
            <button data-edit="${a.id}" class="tj-btn" style="padding:5px 12px; font-size:11.5px;">რედაქტირება</button>

  // ================= DASHBOARD =================
  function tradesInRange(){
    let list = trades.filter(t=>t.outcome);
    if (dashAccountId) list = list.filter(t=>t.accountId===dashAccountId);
    if (dashRange !== 'all'){
      const days = Number(dashRange);
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
      const cutoffStr = cutoff.toISOString().slice(0,10);
      list = list.filter(t=>t.date >= cutoffStr);
    }
    return list.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  }

    const profitFactor = sumNegR!==0 ? sumPosR/Math.abs(sumNegR) : (sumPosR>0?Infinity:0);
    const usdTrades = list.filter(hasUsd);
    const netUsd = usdTrades.reduce((s,t)=>s+num(t.pnlUsd),0);

    let cum=0, peak=0, maxDD=0;

        ${metricCard('EXPECTANCY', fmtR(avgR)+' / ტრეიდი', '', null, 7)}
      </div>
      <div class="tj-rise" style="display:grid; grid-template-columns:2fr 1fr; gap:20px; margin-bottom:24px; --tj-delay:120ms;" id="tj-dash-charts-grid">

          <div style="font-size:13px; font-weight:500; margin-bottom:12px;">Equity Curve (R)</div>
          <div style="position:relative; height:220px;"><canvas id="tj-eq-chart"></canvas></div>
        </div>
        <div class="tj-panelcard" style="padding:18px 20px;">
          <div style="font-size:13px; font-weight:500; margin-bottom:16px;">Win / Loss</div>
          <div style="display:flex; align-items:center; gap:16px;">
            ${ring(winRate,90,'var(--tj-green)')}
            <div><div class="tj-mono" style="font-size:22px; font-weight:600;">${winRate}%</div><div style="font-size:11px; color:var(--tj-text3);">${wins.length}W / ${losses.length}L</div></div>
          </div>
        </div>
      </div>
      <div class="tj-panelcard tj-rise" style="padding:18px 20px; margin-bottom:24px; --tj-delay:170ms;">
        <div style="font-size:13px; font-weight:500; margin-bottom:12px;">დღიური შედეგი (R)</div>

    let cumR=0;
    const eqSeries = list.map(t=>(cumR+=num(t.resultR)));
    const dayGroups = {};
    list.forEach(t=>{ dayGroups[t.date] = dayGroups[t.date] || {r:0,usd:0,n:0}; dayGroups[t.date].r += num(t.resultR); if (hasUsd(t)) dayGroups[t.date].usd += num(t.pnlUsd); dayGroups[t.date].n++; });

        type:'line',
        data:{ labels: eqSeries.map((_,i)=>i+1), datasets:[{ data: eqSeries, borderColor:'#E6B94D', backgroundColor:'rgba(169,133,60,0.14)', fill:true, tension:0.2, pointRadius:0, borderWidth:2 }] },
        options:{ responsive:true, maintainAspectRatio:false, animation:{duration:900,easing:'easeOutCubic'}, plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false},ticks:{color:textColor,font:{size:10}}}, y:{grid:{color:gridColor},ticks:{color:textColor,font:{size:10}}} } }
      });
      new Chart(dashEl.querySelector('#tj-daily-chart'), {
        type:'bar',
        data:{ labels: dayLabels.map(d=>d.slice(5)), datasets:[{ data: dayLabels.map(d=>Number(dayGroups[d].r.toFixed(2))), backgroundColor: dayLabels.map(d=>dayGroups[d].r>=0?'#5FA876':'#C15D4C') }] },
