<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>სტატიები - Traders Academy</title>
<meta name="description" content="ყოველდღიური ბაზრის ანალიზი, Price Action Tips და თრეიდერის ფსიქოლოგია - Traders Academy-ის ბლოგი."/>
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png"/>
<link rel="icon" href="/assets/favicon-16.png" sizes="16x16" type="image/png"/>
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"/>
<link rel="canonical" href="https://tradersacademy.ge/blog/"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="Traders Academy"/>
<meta property="og:locale" content="ka_GE"/>
<meta property="og:url" content="https://tradersacademy.ge/blog/" id="og-url"/>
<meta property="og:title" content="სტატიები - Traders Academy" id="og-title"/>
<meta property="og:description" content="ყოველდღიური ბაზრის ანალიზი, Price Action Tips და თრეიდერის ფსიქოლოგია - Traders Academy-ის ბლოგი." id="og-desc"/>
<meta property="og:image" content="https://tradersacademy.ge/assets/og-image.jpg" id="og-image"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="სტატიები - Traders Academy" id="tw-title"/>
<meta name="twitter:description" content="ყოველდღიური ბაზრის ანალიზი, Price Action Tips და თრეიდერის ფსიქოლოგია - Traders Academy-ის ბლოგი." id="tw-desc"/>
<meta name="twitter:image" content="https://tradersacademy.ge/assets/og-image.jpg" id="tw-image"/>
<link rel="stylesheet" href="/assets/site.css"/>
</head>
<body>
<a href="#main-content" class="skip-link">კონტენტზე გადასვლა</a>
<header id="ta-nav" class="nav"></header>
<main id="main-content">

<section class="section" style="padding-bottom:28px;">
  <div class="wrap">
    <div class="eyebrow">სტატიები</div>
    <h1 class="serif" style="font-size:34px; font-weight:600; margin:0 0 24px;">ბაზრის ანალიზი და Price Action</h1>
    <div id="cat-filters" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="wrap">
    <div id="posts-container">
      <div style="color:var(--text3); font-size:14px;">იტვირთება…</div>
    </div>
  </div>
</section>

</main>
<footer id="ta-footer" class="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/site.js"></script>
<script>
  TA.mountNav('/blog/');
  TA.mountFooter();
  TA.mountAmbient();

  const CATS = [['', 'ყველა'], ['market_analysis', 'ბაზრის ანალიზი'], ['price_action_tips', 'Price Action Tips'], ['psychology', 'ფსიქოლოგია']];
  let activeCat = new URLSearchParams(location.search).get('category') || '';
  let allPosts = [];

  function renderFilters(){
    const el = document.getElementById('cat-filters');
    el.innerHTML = CATS.map(([val, label]) => `
      <button data-cat="${val}" class="btn btn-sm" style="${activeCat===val ? 'border-color:var(--accent); background:rgba(var(--accent-rgb),0.16);' : ''}">${label}</button>
    `).join('');
    el.querySelectorAll('[data-cat]').forEach(b => {
      b.onclick = () => { activeCat = b.dataset.cat; renderFilters(); renderPosts(); };
    });
  }

  function renderPosts(){
    const el = document.getElementById('posts-container');
    const list = activeCat ? allPosts.filter(p => p.category === activeCat) : allPosts;
    if (!list.length){
      el.innerHTML = '<div style="color:var(--text3); font-size:14px; padding:40px 0;">ამ კატეგორიაში სტატიები ჯერ არ არის.</div>';
      return;
    }
    const [featured, ...rest] = list;
    el.innerHTML = `
      <a href="/blog/post.html?slug=${encodeURIComponent(featured.slug)}" style="display:block; text-decoration:none; color:inherit; padding-bottom:32px; margin-bottom:28px; border-bottom:0.5px solid var(--border);">
        <div class="mono" style="font-size:11.5px; color:var(--text3); margin-bottom:10px;">${TA.CATEGORY_LABELS[featured.category]||featured.category} · ${TA.fmtDate(featured.created_at)}</div>
        <div class="serif" style="font-size:26px; font-weight:600; margin-bottom:10px; max-width:32ch;">${TA.escapeHtml(featured.title)}</div>
        <div style="font-size:15px; color:var(--text2); max-width:64ch;">${TA.escapeHtml(featured.excerpt||'')}</div>
      </a>
      ${rest.map(p => `
        <a href="/blog/post.html?slug=${encodeURIComponent(p.slug)}" style="display:block; text-decoration:none; color:inherit; padding:20px 0; border-bottom:0.5px solid var(--border);">
          <div class="mono" style="font-size:11px; color:var(--text3); margin-bottom:6px;">${TA.CATEGORY_LABELS[p.category]||p.category} · ${TA.fmtDate(p.created_at)}</div>
          <div class="serif" style="font-size:18px; font-weight:600; margin-bottom:4px;">${TA.escapeHtml(p.title)}</div>
          <div style="font-size:13.5px; color:var(--text2);">${TA.escapeHtml(p.excerpt||'')}</div>
        </a>
      `).join('')}
    `;
  }

  (async function load(){
    const containerEl = document.getElementById('posts-container');
    containerEl.setAttribute('aria-live', 'polite');
    try {
      const { data, error } = await TA.withTimeout(
        TA.sb.from('posts').select('slug,title,category,excerpt,created_at').eq('published', true).order('created_at', { ascending: false })
      );
      if (error) throw error;
      allPosts = data || [];
      renderFilters();
      renderPosts();
      TA.initScrollRevealRepeat();
    } catch(e){
      containerEl.innerHTML = `<div class="status-msg status-error">სტატიების ჩატვირთვა ვერ მოხერხდა${e && e.message ? ': ' + TA.escapeHtml(e.message) : '.'} <button type="button" id="retry-load" style="background:none; border:none; color:var(--accent); text-decoration:underline; cursor:pointer; padding:0; font:inherit;">სცადეთ თავიდან</button></div>`;
      const retryBtn = document.getElementById('retry-load');
      if (retryBtn) retryBtn.onclick = load;
    }
  })();
</script>
</body>
</html>
