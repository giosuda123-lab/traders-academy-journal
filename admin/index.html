<script>
  TA.mountNav('');
  TA.mountFooter();
  TA.mountAmbient();

  const root = document.getElementById('admin-root');
  let currentUser = null;
  let posts = [];
  let editingPost = null; // null | {} | post-object
  let testimonials = [];
  let editingTestimonial = null;
  let adminTab = 'posts'; // 'posts' | 'testimonials' | 'users' | 'curriculum'
  let quillEditor = null;
  let profiles = [];
  let allTrades = [];
  let usersDataLoaded = false;
  let enrolledUserIds = new Set();
  const TA_COURSE_ID = 'price-action-preview';
  let viewingUserId = null; // null = სია, სხვანაირად კონკრეტული მომხმარებლის ტრეიდები

  // სურათს canvas-ით ამცირებს/კუმშავს, JPEG data URL-ს აბრუნებს - Supabase-ის
  // TEXT/JSONB ველებში ინახება პირდაპირ ცალკე storage-ის გარეშე.
  function compressImageToDataUrl(file, maxW, quality){
    maxW = maxW || 1000; quality = quality || 0.78;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('სურათის წაკითხვა ვერ მოხერხდა'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('ფაილის წაკითხვა ვერ მოხერხდა'));
      reader.readAsDataURL(file);
    });
  }

  function slugify(str){
    const map = { 'ა':'a','ბ':'b','გ':'g','დ':'d','ე':'e','ვ':'v','ზ':'z','თ':'t','ი':'i','კ':'k','ლ':'l','მ':'m','ნ':'n','ო':'o','პ':'p','ჟ':'zh','რ':'r','ს':'s','ტ':'t','უ':'u','ფ':'f','ქ':'q','ღ':'gh','ყ':'y','შ':'sh','ჩ':'ch','ც':'ts','ძ':'dz','წ':'w','ჭ':'ch','ხ':'x','ჯ':'j','ჰ':'h' };
    return str.toLowerCase().split('').map(ch => map[ch] !== undefined ? map[ch] : ch).join('')
      .replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-').replace(/-+/g, '-');
  }

  async function boot(){
    currentUser = await TA.getUser();
    if (!currentUser){
      root.innerHTML = `<div class="card" style="max-width:400px;"><div class="serif" style="font-size:17px; font-weight:600; margin-bottom:14px;">ადმინის შესვლა</div><div id="admin-auth"></div></div>`;
      TA.renderAuthWidget(document.getElementById('admin-auth'), async (user) => { currentUser = user; boot(); });
      return;
    }
    const isAdmin = await TA.isAdmin(currentUser.id);
    if (!isAdmin){
      root.innerHTML = `<div style="font-size:14px; color:var(--text2);">ეს ანგარიშს ადმინის უფლება არ აქვს. თუ ეს შენი ანგარიშია, გაააქტიურე is_admin ველი Supabase-ის profiles ცხრილში.</div>`;
      return;
    }
    await loadPosts();
    await loadTestimonials();
    renderList();
  }

  async function loadPosts(){
    const { data, error } = await TA.sb.from('posts').select('*').order('created_at', { ascending: false });
    posts = error ? [] : (data || []);
  }

  async function loadTestimonials(){
    const { data, error } = await TA.sb.from('testimonials').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: false });
    testimonials = error ? [] : (data || []);
  }

  // დარეგისტრირებული მომხმარებლების და ყველას ტრეიდების ჩატვირთვა - მხოლოდ
  // მაშინ, როცა ადმინი პირველად გახსნის "მომხმარებლების" ტაბს (არა ყოველ
  // admin-გვერდის ჩატვირთვისას). საჯარო ხედვას საჭიროებს ახალი RLS policy
  // (supabase/admin-users-view.sql) - თუ ის გაშვებული არ არის, error-ი
  // მშვიდად აჩვენებს ცარიელ სიას/შეცდომის შეტყობინებას.
  async function loadUsersData(){
    const [profRes, tradesRes] = await Promise.all([
      TA.sb.from('profiles').select('id,display_name,created_at').order('created_at', { ascending: false }),
      TA.sb.from('trades').select('id,user_id,data,created_at')
    ]);
    if (profRes.error) throw profRes.error;
    profiles = profRes.data || [];
    allTrades = tradesRes.error ? [] : (tradesRes.data || []);
    const enrollResult=await TA.sb.from('course_enrollments').select('user_id').eq('course_id',TA_COURSE_ID);
    if(enrollResult.error) throw enrollResult.error;
    enrolledUserIds=new Set((enrollResult.data||[]).map(x=>x.user_id));
    usersDataLoaded = true;
  }

  function renderList(){
    root.innerHTML = `
      <div style="display:flex; gap:8px; margin-bottom:24px;">
        <button id="tab-posts" class="btn btn-sm" style="${adminTab==='posts' ? 'border-color:var(--accent); background:rgba(var(--accent-rgb),0.16);' : ''}">სტატიები</button>
        <button id="tab-testimonials" class="btn btn-sm" style="${adminTab==='testimonials' ? 'border-color:var(--accent); background:rgba(var(--accent-rgb),0.16);' : ''}">ვიდეო-რევიუები</button>
        <button id="tab-curriculum" class="btn btn-sm" style="${adminTab==='curriculum' ? 'border-color:var(--accent); background:rgba(var(--accent-rgb),0.16);' : ''}">ვიდეოკურსის მართვა</button>
        <button id="tab-quizzes" class="btn btn-sm">მოდულის ტესტები</button>
        <button id="tab-users" class="btn btn-sm" style="${adminTab==='users' ? 'border-color:var(--accent); background:rgba(var(--accent-rgb),0.16);' : ''}">მომხმარებლები</button>
      </div>
      <div id="tab-content"></div>
    `;
    document.getElementById('tab-posts').onclick = () => { adminTab = 'posts'; renderList(); };
    document.getElementById('tab-testimonials').onclick = () => { adminTab = 'testimonials'; renderList(); };
    document.getElementById('tab-curriculum').onclick = () => {adminTab='curriculum';renderList();};
    document.getElementById('tab-quizzes').onclick = () => {adminTab='quizzes';renderList();};
    document.getElementById('tab-users').onclick = () => { adminTab = 'users'; viewingUserId = null; renderList(); };
    if (adminTab === 'posts') renderPostsList();
    else if (adminTab === 'testimonials') renderTestimonialsList();
    else if(adminTab==='curriculum')renderCurriculum();
    else if(adminTab==='quizzes')renderQuizManager();
    else renderUsersTab();
  }


  // Course curriculum admin: all writes pass Supabase admin RLS.
  const COURSE_ID='price-action-preview';
  async function loadCurriculum(){
    const m=await TA.sb.from('course_modules').select('*').eq('course_id',COURSE_ID).order('sort_order').order('created_at');
    if(m.error)throw m.error;
    const modules=m.data||[];
    let lessons=[];
    if(modules.length){
      const l=await TA.sb.from('course_lessons').select('*').in('module_id',modules.map(x=>x.id)).order('sort_order').order('created_at');
      if(l.error)throw l.error;lessons=l.data||[];
    }
    let videoIds=[];
    if(lessons.length){
      const v=await TA.sb.from('course_lesson_videos').select('lesson_id,bunny_video_id').in('lesson_id',lessons.map(x=>x.id));
      if(v.error)throw v.error;videoIds=v.data||[];
    }
    return {modules,lessons,videoIds};
  }
  async function renderCurriculum(){
    const tc=document.getElementById('tab-content');
    tc.innerHTML='<p style="color:var(--text2)">მოდულები იტვირთება...</p>';
    let structure;
    try{structure=await loadCurriculum()}catch(e){tc.textContent='მონაცემების ჩატვირთვა ვერ მოხერხდა: '+e.message+' — ჯერ გაუშვით supabase/course-curriculum.sql';return}
    if(adminTab!=='curriculum')return;
    const {modules,lessons,videoIds}=structure;
    tc.replaceChildren();
    const heading=document.createElement('h2');heading.className='serif';heading.textContent='ვიდეოკურსის მოდულები';tc.append(heading);
    const subtitle=document.createElement('p');subtitle.style.color='var(--text2)';subtitle.style.fontSize='13px';subtitle.textContent='აქ შეგიძლია მოდულების, გაკვეთილების და Bunny Video ID-ების მართვა. დაცული პლეერი ცალკე ჩაირთვება.';tc.append(subtitle);
    const create=document.createElement('button');create.className='btn btn-primary';create.textContent='+ ახალი მოდული';create.style.marginBottom='22px';create.onclick=()=>editModule();tc.append(create);
    if(!modules.length){const empty=document.createElement('p');empty.textContent='მოდულები ჯერ არ არის. დაამატე პირველი მოდული.';tc.append(empty)}
    function button(label,fn){const b=document.createElement('button');b.className='btn btn-sm';b.textContent=label;b.onclick=fn;return b}
    function editModule(m){
      const title=prompt('მოდულის სახელი:',m?.title||'');if(title===null)return;
      if(!title.trim())return alert('მოდულის დასახელება სავალდებულოა');
      const order=prompt('რიგითობა (0, 1, 2 ...):',String(m?.sort_order??modules.length));if(order===null)return;
      const sort_order=Number(order);if(!Number.isInteger(sort_order))return alert('რიგითობა უნდა იყოს მთელი რიცხვი');
      (async()=>{
        const payload={title:title.trim(),sort_order};
        const result=m
          ?await TA.sb.from('course_modules').update(payload).eq('id',m.id)
          :await TA.sb.from('course_modules').insert({...payload,course_id:COURSE_ID});
        if(result.error)alert(result.error.message);else renderCurriculum();
      })();
    }
    function editLesson(l,moduleId){
      const title=prompt('ლექციის სახელი:',l?.title||'');if(title===null)return;
      if(!title.trim())return alert('ლექციის დასახელება სავალდებულოა');
      const order=prompt('რიგითობა (0, 1, 2 ...):',String(l?.sort_order??lessons.filter(x=>x.module_id===moduleId).length));if(order===null)return;
      const sort_order=Number(order);if(!Number.isInteger(sort_order))return alert('რიგითობა უნდა იყოს მთელი რიცხვი');
      (async()=>{
        const payload={title:title.trim(),sort_order};
        const result=l
          ?await TA.sb.from('course_lessons').update(payload).eq('id',l.id)
          :await TA.sb.from('course_lessons').insert({...payload,module_id:moduleId});
        if(result.error)alert(result.error.message);else renderCurriculum();
      })();
    }
    async function changeVideo(l){
      const old=videoIds.find(v=>v.lesson_id===l.id)?.bunny_video_id||'';
      const id=prompt('ჩასვი Bunny Stream ვიდეოს ID (UUID). წასაშლელად დატოვე ცარიელი:',old);if(id===null)return;
      const value=id.trim();
      if(value&&!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value))return alert('ვიდეოს ID უნდა იყოს UUID ფორმატში, არა ბმული ან API გასაღები');
      const r=value
        ?await TA.sb.from('course_lesson_videos').upsert({lesson_id:l.id,bunny_video_id:value})
        :await TA.sb.from('course_lesson_videos').delete().eq('lesson_id',l.id);
      if(r.error)alert(r.error.message);else renderCurriculum();
    }
    modules.forEach(m=>{
      const card=document.createElement('div');card.className='card';card.style.marginBottom='16px';card.style.padding='20px';
      const head=document.createElement('div');head.style.cssText='display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center';
      const title=document.createElement('strong');title.textContent=m.title+' · #'+m.sort_order;head.append(title);
      const actions=document.createElement('div');actions.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
      actions.append(button('შეცვლა',()=>editModule(m)),button('+ ლექცია',()=>editLesson(null,m.id)),button('წაშლა',async()=>{if(!confirm('მოდულის წაშლა მის ყველა ლექციას წაშლის. გავაგრძელოთ?'))return;const r=await TA.sb.from('course_modules').delete().eq('id',m.id);if(r.error)alert(r.error.message);else renderCurriculum()}));
      head.append(actions);card.append(head);
      lessons.filter(x=>x.module_id===m.id).forEach(l=>{
        const item=document.createElement('div');item.style.cssText='border-top:1px solid var(--border);padding-top:13px;margin-top:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap';
        const info=document.createElement('div');const label=document.createElement('div');label.style.fontSize='14px';label.textContent=l.title+' · #'+l.sort_order;
        const status=document.createElement('small');status.style.color='var(--text3)';status.textContent=videoIds.some(v=>v.lesson_id===l.id)?'Bunny ვიდეო მიმაგრებულია':'ვიდეო ჯერ არ არის მიმაგრებული';info.append(label,status);
        const controls=document.createElement('div');controls.style.cssText='display:flex;gap:7px;flex-wrap:wrap';
        controls.append(button('ვიდეოს ID',()=>changeVideo(l)),button('შეცვლა',()=>editLesson(l,m.id)),button('წაშლა',async()=>{if(!confirm('წავშალოთ ლექცია?'))return;const r=await TA.sb.from('course_lessons').delete().eq('id',l.id);if(r.error)alert(r.error.message);else renderCurriculum()}));
        item.append(info,controls);card.append(item)
      });
      tc.append(card);
    });
  }


  async function renderQuizManager(){
    const root=document.getElementById('tab-content');root.textContent='ტესტები იტვირთება...';
    const {data:mods,error:me}=await TA.sb.from('course_modules').select('id,title').eq('course_id',COURSE_ID).order('sort_order');
    if(me){root.textContent=me.message;return}
    const {data:qs,error:qe}=(mods||[]).length
      ?await TA.sb.from('course_module_quiz_questions').select('*').in('module_id',mods.map(m=>m.id)).order('sort_order')
      :{data:[],error:null};
    if(qe){root.textContent=qe.message+' — ჯერ გაუშვი supabase/module-quiz.sql';return}
    if(adminTab!=='quizzes')return;
    root.replaceChildren();
    const h=document.createElement('h2');h.textContent='მოდულის შემაჯამებელი ტესტები';h.className='serif';root.append(h);
    const intro=document.createElement('p');intro.textContent='დაამატე 3–5 კითხვა თითო მოდულზე. კითხვები არ გამოჩნდება, სანამ არ გამოაქვეყნებ.';root.append(intro);
    const makeButton=(label,callback)=>{const b=document.createElement('button');b.className='btn btn-sm';b.textContent=label;b.onclick=callback;return b};
    async function editQuestion(m,q){
      const question=prompt('კითხვა:',q?.question||'');if(question===null)return;
      if(!question.trim())return alert('შეიყვანე კითხვა');
      const options=[];
      for(let i=0;i<4;i++){
        const answer=prompt('პასუხი '+(i+1),q?.options?.[i]||'');
        if(answer===null)return;if(!answer.trim())return alert('ოთხივე პასუხი აუცილებელია');
        options.push(answer.trim());
      }
      const correct=prompt('სწორი პასუხის ნომერი (1–4)',q?String(q.correct_index+1):'1');
      if(correct===null)return;
      const n=Number(correct)-1;if(!Number.isInteger(n)||n<0||n>3)return alert('აირჩიე ნომერი 1–4');
      const explanation=prompt('სწორი პასუხის ახსნა:',q?.explanation||'');if(explanation===null)return;
      const published=confirm('გამოვაქვეყნოთ? OK — კი, Cancel — Draft');
      const data={module_id:m.id,question:question.trim(),options,correct_index:n,explanation,sort_order:q?.sort_order??(qs||[]).filter(x=>x.module_id===m.id).length,published};
      const res=q?await TA.sb.from('course_module_quiz_questions').update(data).eq('id',q.id)
        :await TA.sb.from('course_module_quiz_questions').insert(data);
      if(res.error)alert(res.error.message);else renderQuizManager();
    }
    for(const m of mods||[]){
      const card=document.createElement('div');card.className='card';card.style.marginBottom='14px';
      const header=document.createElement('div');header.style.cssText='display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap';
      const title=document.createElement('strong');title.textContent=m.title;header.append(title,makeButton('+ კითხვა',()=>editQuestion(m,null)));card.append(header);
      const list=(qs||[]).filter(x=>x.module_id===m.id);
      if(!list.length){const p=document.createElement('p');p.textContent='კითხვები ჯერ არ არის';card.append(p)}
      for(const q of list){
        const row=document.createElement('div');row.style.cssText='border-top:1px solid var(--border);padding:11px 0;display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap';
        const name=document.createElement('span');name.style.fontSize='13px';name.textContent=q.question+' · '+(q.published?'გამოქვეყნებულია':'Draft');

        <div>

          <div style="display:flex; align-items:center; gap:12px;">
            <label class="btn btn-sm" style="cursor:pointer;">
              სურათის არჩევა
              <input type="file" accept="image/*" id="f-cover-input" style="display:none;"/>
            </label>
            <div id="f-cover-preview">
              ${p.cover_image ? `<img src="${p.cover_image}" style="height:44px; border-radius:6px; border:0.5px solid var(--border);"/>` : `<span style="font-size:12px; color:var(--text3);">არ არის არჩეული</span>`}
            </div>
            ${p.cover_image ? `<button type="button" id="f-cover-remove" style="background:none; border:none; color:var(--red); font-size:12px; cursor:pointer;">წაშლა</button>` : ''}
          </div>
        </div>
        <div>
          <label class="field-label">კონტენტი</label>
          <div id="f-content-editor"></div>
          <p style="font-size:11.5px; color:var(--text3); margin-top:8px;">მონიშნეთ ტექსტი ზომის/სტილის შესაცვლელად - ისე, როგორც ჩვეულებრივ ტექსტურედაქტორში. სურათის ღილაკი (🖼) კურსორის ადგილზე ჩასვამს ავტომატურად შეკუმშულ ვერსიას.</p>
        </div>
        <div><label style="display:flex; align-items:center; gap:8px; font-size:14px;"><input type="checkbox" id="f-published" ${p.published?'checked':''}/> გამოქვეყნებულია</label></div>
        <div id="editor-msg"></div>
        <div style="display:flex; gap:10px;">
          <button id="save-btn" class="btn btn-primary">შენახვა</button>
        </div>
      </div>
    `;
    document.getElementById('back-btn').onclick = () => { editingPost = null; renderList(); };
    document.getElementById('f-title').addEventListener('input', (e) => {
      if (!p.id) document.getElementById('f-slug').value = slugify(e.target.value);
    });

    // Quill rich-text რედაქტორი - ვიზუალური, ისე როგორც ჩვეულებრივ ტექსტ-რედაქტორში
    async function quillImageHandler(){
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*';
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        try {
          const dataUrl = await compressImageToDataUrl(file, 1000, 0.75);
          const caption = prompt('ფოტოს აღწერა (არასავალდებულო - ცარიელი დატოვეთ, თუ არ გინდათ):', '') || '';
          const range = quillEditor.getSelection(true);
          const safeCaption = caption.trim()
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const html = '<p><img src="' + dataUrl + '"/></p>' +
            (safeCaption ? '<p><em>' + safeCaption + '</em></p>' : '');
          quillEditor.clipboard.dangerouslyPasteHTML(range.index, html, 'user');
        } catch (err) {
          alert('სურათის დამუშავება ვერ მოხერხდა.');
        }
      };
      input.click();
    }
    quillEditor = new Quill('#f-content-editor', {
      theme: 'snow',
      placeholder: 'დაიწყეთ წერა...',
      modules: {
        toolbar: {
          container: [
            [{ header: [2, 3, false] }],
            [{ size: ['small', false, 'large', 'huge'] }],
            ['bold', 'italic', 'underline'],
            [{ color: [] }],
            [{ list: 'ordered' }, { list: 'bullet' }],
            ['blockquote', 'link', 'image'],
            ['clean']
          ],
          handlers: { image: quillImageHandler }
        }
      }
    });
    quillEditor.root.innerHTML = p.content || '';

    // renderEditor() ხელახლა აგებს მთელ ფორმას `p`-ობიექტიდან - ამიტომ, სანამ
    // ამას გავუშვებთ (მაგ. cover-image ცვლილებისას), აუცილებლად უნდა შევინახოთ
    // ეკრანზე უკვე ჩაწერილი მონაცემები `p`-ში, თორემ დაიკარგება.
    function syncFormToP(){
      const t = document.getElementById('f-title');
      const s = document.getElementById('f-slug');
      const c = document.getElementById('f-category');
      const ex = document.getElementById('f-excerpt');
      const pub = document.getElementById('f-published');
      if (t) p.title = t.value;
      if (s) p.slug = s.value;
      if (c) p.category = c.value;
      if (ex) p.excerpt = ex.value;
      if (pub) p.published = pub.checked;
      if (quillEditor) p.content = quillEditor.root.innerHTML;
    }

    // გარეკანის სურათის ატვირთვა
    document.getElementById('f-cover-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const dataUrl = await compressImageToDataUrl(file, 1200, 0.8);
        syncFormToP();
        p.cover_image = dataUrl;
        renderEditor();
      } catch (err) {
        alert('სურათის დამუშავება ვერ მოხერხდა.');
      }
    });
    const coverRemoveBtn = document.getElementById('f-cover-remove');
    if (coverRemoveBtn) coverRemoveBtn.onclick = () => { syncFormToP(); p.cover_image = null; renderEditor(); };

    document.getElementById('save-btn').onclick = async () => {
      const payload = {
        title: document.getElementById('f-title').value.trim(),
        slug: document.getElementById('f-slug').value.trim(),
        category: document.getElementById('f-category').value,
        excerpt: document.getElementById('f-excerpt').value.trim(),
        content: quillEditor ? quillEditor.root.innerHTML : '',
        published: document.getElementById('f-published').checked,
        cover_image: p.cover_image || null,
        author_id: currentUser.id
      };
      const msg = document.getElementById('editor-msg');
      if (!payload.title || !payload.slug){ msg.innerHTML = '<div class="status-msg status-error">სათაური და Slug სავალდებულოა.</div>'; return; }
      let error;
      if (p.id){
        ({ error } = await TA.sb.from('posts').update(payload).eq('id', p.id));
      } else {
        ({ error } = await TA.sb.from('posts').insert(payload));
      }
      if (error){ msg.innerHTML = `<div class="status-msg status-error">${TA.escapeHtml(error.message)}</div>`; return; }
      msg.innerHTML = '<div class="status-msg status-ok">შენახულია.</div>';
      await loadPosts();
      setTimeout(() => { editingPost = null; renderList(); }, 600);
    };
  }

      <div style="display:flex; flex-direction:column;">
        ${testimonials.length === 0 ? '<div style="color:var(--text3); font-size:14px;">ჯერ არცერთი რევიუ არ არის.</div>' : testimonials.map(t => `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:14px; padding:16px 0; border-bottom:0.5px solid var(--border);">
            <div style="display:flex; align-items:center; gap:14px;">
              <video src="${t.video_url}" style="width:80px; height:60px; object-fit:cover; border-radius:6px; background:var(--panel2);" muted preload="metadata"></video>
              <div>
                <div style="font-size:15px; font-weight:600;">${TA.escapeHtml(t.student_name)} ${!t.published ? '<span class="badge" style="margin-left:8px;">დამალული</span>' : ''}</div>
                <div class="mono" style="font-size:11.5px; color:var(--text3); margin-top:4px;">რიგითობა: ${t.sort_order}</div>
              </div>
            </div>
            <div style="display:flex; gap:8px; flex-shrink:0;">
              <button class="btn btn-sm" data-tedit="${t.id}">რედაქტირება</button>
              <button class="btn btn-sm" data-tdel="${t.id}" style="color:var(--red);">წაშლა</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    document.getElementById('new-testimonial-btn').onclick = () => { editingTestimonial = { student_name:'', quote:'', video_url:null, published:true, sort_order: testimonials.length }; renderTestimonialEditor(); };
    tc.querySelectorAll('[data-tedit]').forEach(b => { b.onclick = () => { editingTestimonial = { ...testimonials.find(t=>t.id===b.dataset.tedit) }; renderTestimonialEditor(); }; });
    tc.querySelectorAll('[data-tdel]').forEach(b => {
      b.onclick = async () => {
        if (!confirm('წავშალო ეს ვიდეო-რევიუ? ვიდეო-ფაილიც წაიშლება.')) return;
        const t = testimonials.find(x => x.id === b.dataset.tdel);
        await TA.sb.from('testimonials').delete().eq('id', b.dataset.tdel);
        if (t && t.video_url){
          try {
            const path = t.video_url.split('/testimonials/')[1];
            if (path) await TA.sb.storage.from('testimonials').remove([path]);
          } catch(e){ /* ფაილის წაშლა ჩავარდა - ცხრილიდან მაინც წაშლილია */ }
        }
        await loadTestimonials(); renderTestimonialsList();
      };
    });
  }

  function renderTestimonialEditor(){
    const t = editingTestimonial;
    const tc = document.getElementById('tab-content');
    tc.innerHTML = `
      <button id="tback-btn" class="btn btn-sm" style="margin-bottom:20px;">← სია</button>
      <div class="serif" style="font-size:20px; font-weight:600; margin-bottom:20px;">${t.id ? 'რევიუს რედაქტირება' : 'ახალი ვიდეო-რევიუ'}</div>
      <div style="display:grid; gap:14px; max-width:520px;">
        <div><label class="field-label">მოსწავლის სახელი</label><input class="input" id="tf-name" value="${TA.escapeHtml(t.student_name||'')}"/></div>
        <div><label class="field-label">ციტატა (სურვილისამებრ)</label><textarea class="input" id="tf-quote" rows="3">${TA.escapeHtml(t.quote||'')}</textarea></div>
        <div>
          <label class="field-label">ვიდეო ფაილი</label>
          <div id="tf-video-area">
            ${t.video_url ? `<video src="${t.video_url}" controls style="width:100%; max-width:320px; border-radius:10px; background:#000;"></video>` : `<span style="font-size:12px; color:var(--text3);">ჯერ არ არის ატვირთული</span>`}
          </div>
          <label class="btn btn-sm" style="cursor:pointer; margin-top:10px; display:inline-block;">
            ${t.video_url ? 'ვიდეოს შეცვლა' : 'ვიდეოს ატვირთვა'}
            <input type="file" accept="video/*" id="tf-video-input" style="display:none;"/>
          </label>
          <span id="tf-video-status" style="font-size:12px; color:var(--text3); margin-left:10px;"></span>
          <p style="font-size:11.5px; color:var(--text3); margin-top:8px;">რეკომენდებულია მოკლე, შეკუმშული ვიდეო (მაქს. ~80MB) - გვერდის ჩატვირთვის სისწრაფისთვის.</p>
        </div>
        <div><label class="field-label">რიგითობა (რაც უფრო პატარა რიცხვი, მით უფრო ადრე ჩანს)</label><input class="input" type="number" id="tf-sort" value="${t.sort_order||0}"/></div>
        <div><label style="display:flex; align-items:center; gap:8px; font-size:14px;"><input type="checkbox" id="tf-published" ${t.published?'checked':''}/> გამოქვეყნებულია</label></div>
        <div id="teditor-msg"></div>
        <div style="display:flex; gap:10px;">
          <button id="tsave-btn" class="btn btn-primary">შენახვა</button>
        </div>
      </div>
    `;
    document.getElementById('tback-btn').onclick = () => { editingTestimonial = null; renderList(); };

    document.getElementById('tf-video-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('tf-video-status');
      const maxBytes = 90 * 1024 * 1024;
      if (file.size > maxBytes){
        statusEl.textContent = 'ფაილი ძალიან დიდია (მაქს. ~90MB).';
        statusEl.style.color = 'var(--red)';
        return;
      }
      statusEl.textContent = 'იტვირთება…';
      statusEl.style.color = 'var(--text3)';
      try {
        const url = await TA.uploadVideoFile(file);
        t.video_url = url;
        renderTestimonialEditor();
      } catch (err) {
        statusEl.textContent = 'ატვირთვა ვერ მოხერხდა: ' + (err && err.message ? err.message : 'უცნობი შეცდომა');
        statusEl.style.color = 'var(--red)';
      }
    });

    document.getElementById('tsave-btn').onclick = async () => {
      const payload = {
        student_name: document.getElementById('tf-name').value.trim(),
        quote: document.getElementById('tf-quote').value.trim() || null,
        video_url: t.video_url,
        sort_order: Number(document.getElementById('tf-sort').value) || 0,
        published: document.getElementById('tf-published').checked
      };
      const msg = document.getElementById('teditor-msg');
      if (!payload.student_name){ msg.innerHTML = '<div class="status-msg status-error">მოსწავლის სახელი სავალდებულოა.</div>'; return; }
      if (!payload.video_url){ msg.innerHTML = '<div class="status-msg status-error">ვიდეოს ატვირთვა სავალდებულოა.</div>'; return; }
      let error;
      if (t.id){
        ({ error } = await TA.sb.from('testimonials').update(payload).eq('id', t.id));
      } else {
        ({ error } = await TA.sb.from('testimonials').insert(payload));
      }
      if (error){ msg.innerHTML = `<div class="status-msg status-error">${TA.escapeHtml(error.message)}</div>`; return; }
      msg.innerHTML = '<div class="status-msg status-ok">შენახულია.</div>';
      await loadTestimonials();
      setTimeout(() => { editingTestimonial = null; renderList(); }, 600);
    };
  }

  boot();
</script>
</body>
</html>
